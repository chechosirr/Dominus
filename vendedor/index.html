<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="title">Vendedor — Dominus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--card:#101318;--line:#1e242e;--txt:#f2f4f8;--mut:#9aa3b2;--acc:#d7dce3;--acc2:#7c5cff}
body{background:linear-gradient(135deg,#100b22 0%,#2b1a4e 38%,#5a5468 68%,#939aab 100%);background-attachment:fixed;color:var(--txt);font-family:Archivo,Arial,sans-serif;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(8,9,13,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;text-decoration:none;color:var(--txt)}
.logo em{font-style:normal;color:var(--acc)}
.back{color:var(--mut);text-decoration:none;font-size:14px}
.cover{position:relative;height:300px;overflow:hidden;background:linear-gradient(135deg,#1a1033,#0b2b33)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,9,13,.85),transparent 55%)}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.profile{position:relative;display:flex;gap:18px;align-items:flex-end;margin-top:-64px;flex-wrap:wrap}
.avatar{flex:0 0 128px;width:128px;height:128px;border-radius:50%;overflow:hidden;border:4px solid var(--bg);background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-content:center;font-weight:900;font-size:52px;color:#0a0c10;z-index:2}
.avatar img{width:100%;height:100%;object-fit:cover}
.p-head{flex:1;min-width:220px;padding-bottom:6px}
.p-head h1{font-size:clamp(26px,5vw,38px);font-weight:900;display:flex;align-items:center;gap:10px}
.verif{color:var(--acc);font-size:22px}
.p-head .loc{color:var(--mut);font-size:14px;margin-top:4px}
.p-actions{display:flex;gap:10px;padding-bottom:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:800;font-size:14px;text-decoration:none}
.btn-wa{background:#22c55e;color:#fff}
.btn-ghost{border:1px solid var(--line);color:var(--txt);background:var(--card)}
.desc{color:var(--mut);font-size:15px;line-height:1.65;max-width:680px;margin:18px 0}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700}
.pill b{color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:26px 18px 70px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px}
.sec-head h2{font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#161b24}
.card-body{padding:13px;display:flex;flex-direction:column;gap:5px;flex:1}
.card-title{font-size:14px;font-weight:700;line-height:1.35;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-price{font-size:19px;font-weight:900;margin-top:auto;padding-top:8px}
.buy{margin-top:8px;display:block;text-align:center;background:var(--acc);color:#0a0c10;font-weight:800;font-size:14px;padding:12px;border-radius:12px;text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:44px 10px;font-size:15px;grid-column:1/-1}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;padding:26px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}.cover{height:340px}}
@media(max-width:560px){.profile{margin-top:-52px}.avatar{flex-basis:104px;width:104px;height:104px;font-size:42px}.cover{height:220px}}
.about{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}
.about h2{font-size:18px;margin-bottom:10px}
.about h2 .hl{color:var(--acc)}
.about p{font-size:14px;line-height:1.7;color:#d4d9e2;white-space:pre-wrap}
.reviews{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}
.reviews h2{font-size:18px;margin-bottom:12px}
.reviews h2 .hl{color:var(--acc)}
.stars{color:#f5b301;font-size:16px;letter-spacing:2px}
.wall-rating{margin-top:6px;font-size:13px;color:var(--mut)}
.avg{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avg b{font-size:30px}
.rev{border-top:1px solid var(--line);padding:13px 0}
.rev .rn{font-weight:700;font-size:14px}
.rev .rt{color:var(--mut);font-size:12px;margin-left:8px}
.rev p{font-size:14px;color:#d4d9e2;margin-top:6px;line-height:1.6}
.rform label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
.rform textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:inherit;font-size:14px;padding:12px;min-height:90px;resize:vertical;outline:none}
.rform textarea:focus{border-color:var(--acc)}
.starin{display:flex;gap:6px}
.starin button{background:none;border:0;color:#3a4354;font-size:30px;cursor:pointer;font-family:inherit;padding:0}
.starin button.on{color:#f5b301}
.rerr{display:none;background:rgba(255,93,93,.12);border:1px solid var(--err);color:#ffb3b3;font-size:13px;border-radius:12px;padding:11px 14px;margin-top:14px}
.login-cta{text-align:center;font-size:14px;color:var(--mut);padding:14px}
.login-cta a{color:var(--acc);font-weight:700;text-decoration:none}
@media(max-width:600px){
.cover{height:150px}
.avatar{width:88px;height:88px;margin:-44px 0 0 16px}
.wall-head{padding:0 14px}
.wall-head h1{font-size:22px}
.card .buy{padding:12px;font-size:14px}
}

/* ===== plateado metálico ===== */
.hl,.logo em{background:linear-gradient(120deg,#ffffff 0%,#c2c9d4 35%,#f4f6f9 55%,#98a2b1 80%,#e8ecf1 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.btn:not(.btn-ghost):not(.btn-wa),.buy,.hero-search button{background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%)!important;color:#0a0c10!important;border:0!important}
.card-price,.pd-price{background:linear-gradient(120deg,#ffffff,#c2c9d4 40%,#f4f6f9 60%,#98a2b1)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../index.html">DOMIN<em>US</em></a>
  <a class="back" href="../index.html">← Marketplace</a>
  <a href="../comprador/perfil.html" style="text-decoration:none;font-size:18px" title="Mi carrito">🛒</a>
</header>
<div id="wall"><div class="empty">Cargando…</div></div>
<main>
  <div class="sec-head"><h2>Productos</h2></div>
  <div class="grid" id="grid"></div>
</main>
<footer>© 2026 Dominus · Compra y vende seguro</footer>
<script>
var SUPABASE_URL = "https://mmmkwkjzfyijnffniykt.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbWt3a2p6Znlpam5mZm5peWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTIzNDUsImV4cCI6MjEwNzY2ODM0NX0.xa-0G0E1vbGZGUvfvWsAMS9vNdg17pR68ee-kU8aur4";
function api(path){
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
  }).then(function(r){ if(!r.ok) throw new Error('API ' + r.status); return r.json(); });
}
function money(n){ return '$' + Number(n).toFixed(2); }
function buyerSession(){ try { var s = JSON.parse(localStorage.getItem('dominus_session')); return (s && s.access_token) ? s : null; } catch(e){ return null; } }
function addToCart(pid, btn){
  var s = buyerSession();
  if(!s){ location.href = '../cuenta.html?tipo=comprador'; return; }
  btn.disabled = true; btn.textContent = 'Agregando…';
  fetch(SUPABASE_URL + '/rest/v1/cart_items', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify({ user_id: s.user.id, product_id: pid, qty: 1 })
  }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if(res.ok && res.j.length && res.j[0].qty > 1){
        var row = res.j[0];
        fetch(SUPABASE_URL + '/rest/v1/cart_items?id=eq.' + row.id, {
          method: 'PATCH', headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ qty: row.qty + 1 })
        });
      }
      btn.textContent = '✓ En el carrito';
      setTimeout(function(){ btn.disabled = false; btn.textContent = '+ Agregar al carrito'; }, 1500);
    }).catch(function(){ btn.disabled = false; btn.textContent = '+ Agregar al carrito'; });
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.add-cart');
  if(b) addToCart(b.dataset.pid, b);
});
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var slug = new URLSearchParams(location.search).get('s') || 'tech-zone';
var SELLER = null, myRating = 5;
function buyerSession(){ try { var s = JSON.parse(localStorage.getItem('dominus_session')); return (s && s.access_token) ? s : null; } catch(e){ return null; } }
function starsHTML(r){ var s = ''; for(var i = 1; i <= 5; i++) s += i <= Math.round(r) ? '★' : '☆'; return '<span class="stars">' + s + '</span>'; }
Promise.all([
  api('sellers?slug=eq.' + encodeURIComponent(slug) + '&select=*&limit=1'),
  api('products?select=*,sellers!inner(slug)&activo=eq.true&sellers.slug=eq.' + encodeURIComponent(slug) + '&order=created_at.desc')
]).then(function(res){
  var s = res[0][0], prods = res[1];
  if(!s){
    document.getElementById('wall').innerHTML = '<div class="empty">Este vendedor no existe.</div>';
    return;
  }
  SELLER = s;
  document.getElementById('title').textContent = s.nombre + ' — Dominus';
  var av = s.logo_url ? '<img src="' + esc(s.logo_url) + '" alt="' + esc(s.nombre) + '">' : esc(s.nombre.charAt(0));
  document.getElementById('wall').innerHTML =
    '<div class="cover">' + (s.cover_url ? '<img src="' + esc(s.cover_url) + '" alt="Portada">' : '') + '<div class="fade"></div></div>'
    + '<div class="wrap"><div class="profile"><span class="avatar">' + av + '</span>'
    + '<div class="p-head"><h1>' + esc(s.nombre) + (s.verificado ? ' <span class="verif">✓</span>' : '') + '</h1>'
    + '<div class="loc">' + esc(s.ubicacion || '') + '</div>'
    + '<div class="wall-rating" id="wall-rating"></div></div>'
    + '</div>'
    + (s.descripcion ? '<p class="desc">' + esc(s.descripcion) + '</p>' : '')
    + '<div class="meta"><span class="pill"><b>' + prods.length + '</b> productos</span>'
    + (s.verificado ? '<span class="pill">✓ Vendedor verificado</span>' : '')
    + '<span class="pill">Pago protegido PayPal</span></div>'
    + (s.descripcion_larga ? '<div class="about"><h2>Acerca de <span class="hl">' + esc(s.nombre) + '</span></h2><p>' + esc(s.descripcion_larga) + '</p></div>' : '')
    + '</div>';
  document.getElementById('grid').innerHTML = prods.length ? prods.map(function(p){
    return '<div class="card"><a href="../producto/?id=' + p.id + '" style="text-decoration:none;color:inherit;display:block">' + (p.imagen_url ? '<img src="' + esc(p.imagen_url) + '" alt="' + esc(p.titulo) + '" loading="lazy">' : '')
      + '<div class="card-body"><div class="card-title">' + esc(p.titulo) + '</div></a>'
      + '<div class="card-price">' + money(p.precio) + '</div>'
      + '<a class="buy" href="' + esc(p.paypal_link || '#') + '" target="_blank" rel="noopener">Comprar con PayPal</a>'
      + '<button class="add-cart" data-pid="' + p.id + '" style="margin-top:8px;width:100%;background:none;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">+ Agregar al carrito</button></div></div>';
  }).join('') : '<div class="empty">Este vendedor aún no publica productos.</div>';
  loadReviews();
}).catch(function(){
  document.getElementById('wall').innerHTML = '<div class="empty">No se pudo cargar. Revisa tu conexión.</div>';
});
function loadReviews(){
  api('seller_reviews?seller_id=eq.' + SELLER.id + '&select=*&order=created_at.desc').then(function(rows){
    var avg = rows.length ? rows.reduce(function(a, r){ return a + r.rating; }, 0) / rows.length : 0;
    var wr = document.getElementById('wall-rating');
    if(wr && rows.length) wr.innerHTML = starsHTML(avg) + ' <small>' + avg.toFixed(1) + ' · ' + rows.length + ' reseña(s)</small>';
    var sess = buyerSession();
    var html = '<div class="wrap"><div class="reviews"><h2>Reseñas <span class="hl">(' + rows.length + ')</span></h2>';
    if(rows.length){
      html += '<div class="avg"><b>' + avg.toFixed(1) + '</b>' + starsHTML(avg) + '</div>';
      html += rows.map(function(r){
        return '<div class="rev"><span class="rn">' + esc(r.nombre || 'Comprador') + '</span><span class="rt">' + new Date(r.created_at).toLocaleDateString('es') + '</span><div>' + starsHTML(r.rating) + '</div><p>' + esc(r.comentario || '') + '</p></div>';
      }).join('');
    } else html += '<p class="empty">Sé el primero en dejar una reseña.</p>';
    if(sess){
      html += '<div class="rform"><h2>Deja tu <span class="hl">reseña</span></h2>'
        + '<label>Calificación</label><div class="starin" id="starin">' + [1,2,3,4,5].map(function(i){ return '<button data-v="' + i + '" class="' + (i <= 5 ? 'on' : '') + '">★</button>'; }).join('') + '</div>'
        + '<label>Comentario</label><textarea id="r-com" placeholder="¿Qué tal tu experiencia con esta empresa?"></textarea>'
        + '<button class="btn" id="r-send" style="margin-top:12px">Publicar reseña</button><div class="rerr" id="rerr"></div></div>';
    } else {
      html += '<p class="login-cta"><a href="../cuenta.html?tipo=comprador">Entra a tu cuenta</a> para dejar una reseña.</p>';
    }
    html += '</div></div>';
    document.getElementById('wall').insertAdjacentHTML('beforeend', html);
    var si = document.getElementById('starin');
    if(si){
      si.querySelectorAll('button').forEach(function(b){
        b.onclick = function(){ myRating = Number(b.dataset.v); si.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', Number(x.dataset.v) <= myRating); }); };
      });
      document.getElementById('r-send').onclick = function(){
        var com = document.getElementById('r-com').value.trim();
        var name = (sess.user.user_metadata && sess.user.user_metadata.nombre) || (sess.user.email || '').split('@')[0] || 'Comprador';
        fetch(SUPABASE_URL + '/rest/v1/seller_reviews', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + sess.access_token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ seller_id: SELLER.id, user_id: sess.user.id, nombre: name, rating: myRating, comentario: com || null })
        }).then(function(r){ if(!r.ok) throw 0; loadReviews(); })
          .catch(function(){ var e = document.getElementById('rerr'); e.textContent = 'No se pudo publicar. Intenta de nuevo.'; e.style.display = 'block'; });
      };
    }
  }).catch(function(){});
}
</script>
</body>
</html>
