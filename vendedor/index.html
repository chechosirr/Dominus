<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="title">Vendedor — Dominus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--card:#101318;--line:#1e242e;--txt:#f2f4f8;--mut:#9aa3b2;--acc:#2e63b8;--acc2:#1e3a6e}
body{background:linear-gradient(180deg,#08090d 0%,#0a1526 55%,#0d1c36 100%);background-attachment:fixed;color:var(--txt);font-family:Archivo,Arial,sans-serif;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(8,9,13,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;text-decoration:none;color:var(--txt)}
.logo em{font-style:normal;color:var(--acc)}
.back{color:var(--mut);text-decoration:none;font-size:14px}
.cover{position:relative;height:300px;overflow:hidden;background:linear-gradient(135deg,#1a1033,#0b2b33)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,9,13,.85),transparent 55%)}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.profile{position:relative;display:flex;gap:18px;align-items:flex-end;margin-top:-64px;flex-wrap:wrap}
.avatar{flex:0 0 128px;width:128px;height:128px;border-radius:50%;overflow:hidden;border:4px solid var(--bg);background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-content:center;font-weight:900;font-size:52px;color:#0a0c10;z-index:2}
.avatar img{width:100%;height:100%;object-fit:cover}
.p-head{flex:1;min-width:220px;padding-bottom:6px}
.p-head h1{font-size:clamp(26px,5vw,38px);font-weight:900;display:flex;align-items:center;gap:10px}
.verif{color:var(--acc);font-size:22px}
.p-head .loc{color:var(--mut);font-size:14px;margin-top:4px}
.p-actions{display:flex;gap:10px;padding-bottom:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:800;font-size:14px;text-decoration:none}
.btn-wa{background:#22c55e;color:#fff}
.btn-ghost{border:1px solid var(--line);color:var(--txt);background:var(--card)}
.desc{color:var(--mut);font-size:15px;line-height:1.65;max-width:680px;margin:18px 0}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700}
.pill b{color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:26px 18px 70px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px}
.sec-head h2{font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#161b24}
.card-body{padding:13px;display:flex;flex-direction:column;gap:5px;flex:1}
.card-title{font-size:14px;font-weight:700;line-height:1.35}
.card-price{font-size:19px;font-weight:900}
.buy{margin-top:8px;display:block;text-align:center;background:var(--acc);color:#fff;font-weight:800;font-size:14px;padding:12px;border-radius:12px;text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:44px 10px;font-size:15px;grid-column:1/-1}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;padding:26px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}.cover{height:340px}}
@media(max-width:560px){.profile{margin-top:-52px}.avatar{flex-basis:104px;width:104px;height:104px;font-size:42px}.cover{height:220px}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../index.html">DOMIN<em>US</em></a>
  <a class="back" href="../index.html">← Marketplace</a>
</header>
<div id="wall"><div class="empty">Cargando…</div></div>
<main>
  <div class="sec-head"><h2>Productos</h2></div>
  <div class="grid" id="grid"></div>
</main>
<footer>© 2026 Dominus · Compra y vende seguro</footer>
<script>
var SUPABASE_URL = "https://mmmkwkjzfyijnffniykt.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbWt3a2p6Znlpam5mZm5peWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTIzNDUsImV4cCI6MjEwNzY2ODM0NX0.xa-0G0E1vbGZGUvfvWsAMS9vNdg17pR68ee-kU8aur4";
function api(path){
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
  }).then(function(r){ if(!r.ok) throw new Error('API ' + r.status); return r.json(); });
}
function money(n){ return '$' + Number(n).toFixed(2); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var slug = new URLSearchParams(location.search).get('s') || 'tech-zone';
Promise.all([
  api('sellers?slug=eq.' + encodeURIComponent(slug) + '&select=*&limit=1'),
  api('products?select=*,sellers!inner(slug)&activo=eq.true&sellers.slug=eq.' + encodeURIComponent(slug) + '&order=created_at.desc')
]).then(function(res){
  var s = res[0][0], prods = res[1];
  if(!s){
    document.getElementById('wall').innerHTML = '<div class="empty">Este vendedor no existe.</div>';
    return;
  }
  if(!s.subscription_active){
    document.getElementById('title').textContent = s.nombre + ' — Dominus';
    document.getElementById('wall').innerHTML = '<div class="wrap" style="padding:70px 18px;text-align:center">'
      + '<h1 style="font-size:30px;margin-bottom:12px">' + esc(s.nombre) + '</h1>'
      + '<p class="empty">Este muro no está disponible por el momento.</p></div>';
    return;
  }
  document.getElementById('title').textContent = s.nombre + ' — Dominus';
  var av = s.logo_url ? '<img src="' + esc(s.logo_url) + '" alt="' + esc(s.nombre) + '">' : esc(s.nombre.charAt(0));
  document.getElementById('wall').innerHTML =
    '<div class="cover">' + (s.cover_url ? '<img src="' + esc(s.cover_url) + '" alt="Portada">' : '') + '<div class="fade"></div></div>'
    + '<div class="wrap"><div class="profile"><span class="avatar">' + av + '</span>'
    + '<div class="p-head"><h1>' + esc(s.nombre) + (s.verificado ? ' <span class="verif">✓</span>' : '') + '</h1>'
    + '<div class="loc">' + esc(s.ubicacion || '') + '</div></div>'
    + '<div class="p-actions"><a class="btn btn-wa" href="https://wa.me/' + esc(s.whatsapp || '15704698339') + '?text=' + encodeURIComponent('Hola ' + s.nombre + ', me interesa un producto de tu muro en Dominus') + '" target="_blank" rel="noopener">WhatsApp</a></div>'
    + '</div>'
    + (s.descripcion ? '<p class="desc">' + esc(s.descripcion) + '</p>' : '')
    + '<div class="meta"><span class="pill"><b>' + prods.length + '</b> productos</span>'
    + (s.verificado ? '<span class="pill">✓ Vendedor verificado</span>' : '')
    + '<span class="pill">Pago protegido PayPal</span></div></div>';
  document.getElementById('grid').innerHTML = prods.length ? prods.map(function(p){
    return '<div class="card">' + (p.imagen_url ? '<img src="' + esc(p.imagen_url) + '" alt="' + esc(p.titulo) + '" loading="lazy">' : '')
      + '<div class="card-body"><div class="card-title">' + esc(p.titulo) + '</div>'
      + '<div class="card-price">' + money(p.precio) + '</div>'
      + '<a class="buy" href="' + esc(p.paypal_link || '#') + '" target="_blank" rel="noopener">Comprar con PayPal</a></div></div>';
  }).join('') : '<div class="empty">Este vendedor aún no publica productos.</div>';
}).catch(function(){
  document.getElementById('wall').innerHTML = '<div class="empty">No se pudo cargar. Revisa tu conexión.</div>';
});
</script>
</body>
</html>
