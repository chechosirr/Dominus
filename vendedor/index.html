<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="title">Vendedor — Dominus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef0f3;--card:#ffffff;--line:#e2e5ea;--txt:#111111;--mut:#5a6270;--acc:#4a4a52;--acc2:#7c5cff}
body{background:#ffffff;background-attachment:fixed;color:#111111;font-family:'Source Sans 3',Archivo,Arial,sans-serif;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#2a2a2e;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;text-decoration:none;flex:0 0 auto;color:#111111!important}
.logo em{font-style:normal;color:var(--acc)}
.back{color:var(--mut);text-decoration:none;font-size:14px}
.cover{position:relative;height:300px;overflow:hidden;background:linear-gradient(135deg,#1a1033,#0b2b33)}
.cover .fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,9,13,.85),transparent 55%)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}

.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.profile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:0;padding-top:22px;z-index:2}
.avatar{flex:0 0 176px;width:176px;height:176px;border-radius:50%;overflow:hidden;border:5px solid var(--bg);background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-content:center;font-weight:900;font-size:64px;color:#0a0c10;z-index:2;box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.avatar img{width:100%;height:100%;object-fit:cover}
.p-head{flex:1;min-width:220px;padding-bottom:6px}
.p-head{padding-bottom:6px}.p-head h1{font-size:clamp(28px,6vw,40px);font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.verif{color:var(--acc);font-size:22px}
.p-head .loc{color:var(--mut);font-size:14px;margin-top:4px}
.p-actions{display:flex;gap:10px;padding-bottom:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:800;font-size:14px;text-decoration:none}
.btn-wa{background:#22c55e;color:#fff}
.btn-ghost{border:1px solid var(--line);color:#111111;background:var(--card)}
.desc{color:var(--mut);font-size:15px;line-height:1.65;max-width:680px;margin:18px 0}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;color:#111111}
.pill b{color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:26px 18px 70px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px}
.sec-head h2{font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.catbar{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hgrid{display:grid;grid-template-rows:repeat(4,auto);grid-auto-flow:column;grid-auto-columns:calc((100% - 28px)/3);overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:start}
.hgrid::-webkit-scrollbar{display:none}
@media(min-width:760px){.hgrid{grid-auto-columns:calc((100% - 56px)/5)}}
.catbar::-webkit-scrollbar{display:none}
.catchip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:#111111;border-radius:999px;padding:9px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.catchip.on{background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%);color:#0a0c10;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;padding:8px;box-sizing:border-box}
.card-body{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.card-title{font-size:14px;font-weight:700;line-height:1.35;color:#111111;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-price{font-size:19px;font-weight:900;margin-top:auto;padding-top:8px}
.buy{margin-top:8px;display:block;text-align:center;background:var(--acc);color:#0a0c10;font-weight:800;font-size:14px;padding:12px;border-radius:12px;text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:44px 10px;font-size:15px;grid-column:1/-1}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;padding:26px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.cover{height:340px}}
@media(max-width:560px){.profile{margin-top:0}.cover{height:230px}}
.about{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}
.about h2{font-size:18px;margin-bottom:10px}
.about h2 .hl{color:var(--acc)}
.about p{font-size:14px;line-height:1.7;color:#33383f;white-space:pre-wrap}
.reviews{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}
.reviews h2{font-size:18px;margin-bottom:12px}
.reviews h2 .hl{color:var(--acc)}
.stars{color:#f5b301;font-size:16px;letter-spacing:2px}
.wall-rating{margin-top:6px;font-size:13px;color:var(--mut)}
.avg{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avg b{font-size:30px}
.rev{border-top:1px solid var(--line);padding:13px 0}
.rev .rn{font-weight:700;font-size:14px}
.rev .rt{color:var(--mut);font-size:12px;margin-left:8px}
.rev p{font-size:14px;color:#33383f;margin-top:6px;line-height:1.6}
.rform label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
.rform textarea{width:100%;background:#ffffff;border:1px solid #d0d4da;border-radius:12px;color:#111111;font-family:inherit;font-size:14px;padding:12px;min-height:90px;resize:vertical;outline:none}
.rform textarea::placeholder{color:#7d8590}
.rform textarea:focus{border-color:var(--acc)}
.starin{display:flex;gap:6px}
.starin button{background:none;border:0;color:#3a4354;font-size:30px;cursor:pointer;font-family:inherit;padding:0}
.starin button.on{color:#f5b301}
.rerr{display:none;background:rgba(255,93,93,.12);border:1px solid var(--err);color:#b3261e;font-size:13px;border-radius:12px;padding:11px 14px;margin-top:14px}
.login-cta{text-align:center;font-size:14px;color:var(--mut);padding:14px}
.login-cta a{color:var(--acc);font-weight:700;text-decoration:none}
.pin-badge{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);margin-bottom:2px}
.feat-sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:0 0 18px}
.feat-sec h2{font-size:18px;margin-bottom:14px}
.feat-sec h2 .hl{color:var(--acc)}
.feat-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.feat-card{flex:0 0 200px;background:var(--bg);border:1px solid var(--acc);border-radius:14px;overflow:hidden;text-decoration:none;display:block}
.feat-card img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff;padding:8px;box-sizing:border-box}
.feat-card div{padding:10px 12px}
.feat-card b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-card span{font-size:15px;font-weight:900;color:var(--acc)}
@media(max-width:600px){
.cover{height:150px}
.avatar{width:88px;height:88px;margin:-44px 0 0 16px}
.wall-head{padding:0 14px}
.wall-head h1{font-size:22px}
.card .buy{padding:12px;font-size:14px}
}

/* ===== plateado metálico ===== */
.hl,.logo em{background:linear-gradient(120deg,#ffffff 0%,#c2c9d4 35%,#f4f6f9 55%,#98a2b1 80%,#e8ecf1 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.btn:not(.btn-ghost):not(.btn-wa),.buy,.hero-search button{background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%)!important;color:#0a0c10!important;border:0!important}
.card-price,.pd-price{background:linear-gradient(120deg,#ffffff,#c2c9d4 40%,#f4f6f9 60%,#98a2b1)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.card-price{background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;color:#111111!important}
.about h2 .hl,.reviews h2 .hl,.feat-sec h2 .hl{background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;color:#4a4a52!important}

.menu-wrap{position:relative;margin-left:auto}
#menu-btn{background:none;border:1px solid var(--line);color:#f2f4f8;font-size:20px;border-radius:12px;padding:8px 13px;cursor:pointer;font-family:inherit}
.menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:200px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.16);z-index:50}
.menu.open{display:block}
.menu a{display:block;padding:14px 20px;text-decoration:none;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);color:#111111}
.menu a:last-child{border-bottom:0}
.menu a:hover{background:rgba(0,0,0,.05)}

/* ===== modo edición tipo Facebook ===== */
#edit-toggle{position:fixed;bottom:20px;right:20px;z-index:200;background:linear-gradient(135deg,#ffffff,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4);color:#0a0c10;border:0;border-radius:999px;padding:14px 22px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:inherit}
.ed-only{display:none!important}
body.editing .ed-only{display:block!important}
body.editing .ed-only-inline{display:inline-block!important}
.ed-cover{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;z-index:3;white-space:nowrap}
.avatar{position:relative}
.ed-avatar{position:absolute;bottom:2px;right:2px;background:var(--acc);color:#0a0c10;border:0;border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;display:grid;place-content:center;z-index:3}
body.editing .editable{cursor:pointer;border-radius:6px}
body.editing .editable:hover{outline:2px dashed var(--acc);outline-offset:4px}
.ed-hint{display:inline-block;background:rgba(215,220,227,.14);color:var(--acc);font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}
.inline-form{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-width:520px}
.inline-form input,.inline-form textarea{background:#ffffff;border:1px solid var(--acc);border-radius:10px;color:#111111;padding:11px 14px;font-family:inherit;font-size:14px;width:100%}
.inline-form .row{display:flex;gap:8px}
.inline-form .row button{flex:1;padding:11px;border-radius:10px;border:0;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px}
.inline-save{background:var(--acc);color:#ffffff}#ep-save{background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%)!important;color:#0a0c10!important;border:0!important}
.inline-cancel{background:var(--card);color:#111111;border:1px solid var(--line)!important}
body.editing .buy,body.editing .add-cart{display:none!important}
.more-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.62);color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;line-height:1;cursor:pointer;z-index:5;font-family:inherit}
.more-menu{display:none;position:absolute;top:52px;right:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:190px;overflow:hidden;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.16)}
.more-menu.open{display:block}
.more-menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:#111111;padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.more-menu button:last-child{border-bottom:0}
.more-menu button.del{color:#b3261e}
.card{position:relative}
body.editing .card{cursor:grab}
.card.dragging{opacity:.4}
.add-prod-card{border:2px dashed var(--line);border-radius:18px;min-height:220px;display:grid;place-content:center;color:var(--mut);font-size:15px;font-weight:700;cursor:pointer;background:transparent;text-align:center;padding:20px}
.add-prod-card:hover{border-color:var(--acc);color:var(--acc)}
.add-prod-card .plus{font-size:40px;display:block;margin-bottom:8px}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.modal h3{margin-bottom:6px;font-size:18px;color:#111111!important}
.modal label{font-size:13px;color:#111111!important;display:block;margin:12px 0 6px}
.modal input,.modal textarea,.modal select{width:100%;background:#ffffff;border:1px solid #d0d4da;border-radius:10px;color:#111111;padding:12px;font-family:inherit;font-size:14px}
.modal input::placeholder,.modal textarea::placeholder{color:#7d8590}
.edit-panel input,.edit-panel textarea,.edit-panel select{width:100%;background:#ffffff;border:1px solid #d0d4da;border-radius:10px;color:#111111;padding:11px 14px;font-family:inherit;font-size:14px}
.edit-panel input::placeholder,.edit-panel textarea::placeholder{color:#7d8590}
.modal .row{display:flex;gap:10px;margin-top:18px}
.modal .row button{flex:1;padding:13px;border-radius:12px;border:0;font-weight:800;cursor:pointer;font-family:inherit;font-size:15px}
.ed-wa{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 16px;margin-top:12px;font-size:13px}
.ed-wa small{color:var(--mut)}

.crop-frame{position:relative;overflow:hidden;background:#0a0c10;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.crop-cover{aspect-ratio:3/1;border-radius:14px;width:100%}
.crop-avatar{aspect-ratio:1/1;border-radius:50%;width:100%;max-width:320px;margin:0 auto}
.crop-frame img{max-width:none!important;pointer-events:none}
.crop-zoom{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
.crop-zoom button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:22px;cursor:pointer;flex:0 0 auto;font-family:inherit}
.crop-zoom input{flex:1;accent-color:var(--acc);height:44px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Dashboard del vendedor */
.dash{background:#ffffff;border:1px solid #e2e5ea;border-radius:22px;padding:36px 28px;margin:26px auto;max-width:620px;box-shadow:0 12px 40px rgba(0,0,0,.10);text-align:center}
.dash h2{font-family:'Source Sans 3',sans-serif;font-size:28px;letter-spacing:1.5px;margin-bottom:8px;color:#111111}
.dash p{color:var(--mut);font-size:14px;margin-bottom:26px}
.dash-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:#f7f7f9;border:1px solid #e2e5ea;border-radius:16px;padding:20px 22px;margin-bottom:14px;cursor:pointer;color:#111111;font-family:'Source Sans 3',sans-serif;font-size:20px;letter-spacing:.5px;transition:border-color .2s,transform .15s}
.ord-ov{position:fixed;inset:0;z-index:400;background:#fff;overflow-y:auto;padding:26px 20px 30px;display:flex;flex-direction:column}
.ord-x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid #d0d4da;background:#fff;font-size:19px;cursor:pointer;color:#111;font-family:inherit}
.ord-tag{display:inline-block;align-self:flex-start;background:#1c7c43;color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border-radius:999px;padding:5px 12px;margin-top:38px}
.ord-h{font-size:27px;font-weight:900;margin:12px 0 4px;color:#111}
.ord-fecha{color:#6a6a72;font-size:14px;margin:0 0 18px}
.ord-items{border:1px solid #e2e5ea;border-radius:14px;padding:6px 14px}
.ord-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eef0f3;font-size:15px;color:#111}
.ord-item:last-child{border-bottom:0}
.ord-item small{color:#6a6a72}
.ord-total{display:flex;justify-content:space-between;font-size:19px;margin:16px 2px;color:#111}
.ord-buyer{background:#f7f8fa;border:1px solid #e2e5ea;border-radius:14px;padding:14px 16px;margin-top:6px;color:#111;font-size:15px}
.ord-buyer h3{font-size:15px;margin:0 0 8px}
.ord-buyer p{margin:4px 0}
.ord-note{color:#44484f;font-size:14px;margin:14px 2px 0}
.ord-more{color:#6a6a72;font-size:13px;margin-top:8px}
.ord-accept{margin-top:auto;width:100%;padding:18px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%);color:#0a0c10;font-family:inherit;font-size:19px;font-weight:900;cursor:pointer}
.today-card{border:1px solid #e2e5ea;border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.today-card.pend{background:#eefaf1;border-color:#9fd4ae}
.today-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6a6a72;margin-bottom:8px}
.today-chip{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:#eceff3;color:#44484f}
.today-card.pend .today-chip{background:#1c7c43;color:#fff}
.today-item{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:#111;padding:5px 0}
.today-item small{color:#6a6a72}
.today-total{display:flex;justify-content:space-between;font-size:17px;color:#111;border-top:1px solid #e2e5ea;margin-top:8px;padding-top:10px}
.today-buyer{font-size:13px;color:#44484f;margin:8px 0 0}
.today-accept{margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%);color:#0a0c10;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer}
.dash-btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.dash-btn span:last-child{color:var(--acc);font-size:22px}
.dash-back{background:#ffffff;border:1px solid #d0d4da;color:var(--acc);font-family:'Source Sans 3',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:16px;padding:10px 20px;border-radius:12px;float:right}
/* Panel de edicion formal */
.edit-panel{background:#ffffff;border:1px solid #e2e5ea;border-radius:22px;padding:30px 28px;margin:22px auto 0;max-width:620px;box-shadow:0 12px 40px rgba(0,0,0,.10)}
.edit-panel h3{font-family:'Source Sans 3',sans-serif;font-size:25px;text-align:center;margin:0 0 8px;letter-spacing:1.5px;color:#111111}
.edit-panel .ep-sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:20px}
.edit-row{display:flex;align-items:center;gap:18px;padding:14px 4px;border-bottom:1px solid rgba(0,0,0,.07)}
.edit-row label{flex:0 0 38%;font-family:'Source Sans 3',sans-serif;font-size:18px;color:#33383f;text-align:right;letter-spacing:.3px}
.edit-row input{flex:1;background:#ffffff;border:1px solid #d0d4da;border-radius:12px;padding:13px 15px;color:#111111;font-family:inherit;font-size:15px;min-width:0;transition:border-color .2s,box-shadow .2s}
.edit-row input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,99,184,.18)}
.edit-row input::placeholder{color:#7d8590}
.edit-panel details{margin-top:14px;border:1px solid #e2e5ea;border-radius:14px;padding:6px 18px 14px;background:#f7f7f9}
.edit-panel summary{font-family:'Source Sans 3',sans-serif;font-size:19px;cursor:pointer;padding:12px 0;list-style:none;text-align:center;letter-spacing:.8px;color:#111111}
.edit-panel summary::-webkit-details-marker{display:none}

(function(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(!s || !s.access_token || !s.refresh_token) return;
    var exp = 0;
    if(s.expires_at) exp = s.expires_at * 1000;
    else { try{ exp = JSON.parse(atob(s.access_token.split('.')[1])).exp * 1000; }catch(e){} }
    if(!exp || Date.now() < exp - 120000) return;
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function(r){ return r.json(); }).then(function(ns){
      if(ns && ns.access_token){ localStorage.setItem('dominus_session', JSON.stringify(ns)); location.reload(); }
      else localStorage.removeItem('dominus_session');
    }).catch(function(){});
  }catch(e){}
})();

function api(path){
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
  }).then(function(r){ if(!r.ok) throw new Error('API ' + r.status); return r.json(); });

function addToCart(pid, btn){
  var s = buyerSession();
  if(!s){ location.href = '../cuenta.html?tipo=comprador'; return; }
  btn.disabled = true; btn.textContent = 'Agregando…';
  fetch(SUPABASE_URL + '/rest/v1/cart_items', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify({ user_id: s.user.id, product_id: pid, qty: 1, talla: '' })
  }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if(res.ok && res.j.length && res.j[0].qty > 1){
        var row = res.j[0];
        fetch(SUPABASE_URL + '/rest/v1/cart_items?id=eq.' + row.id, {
          method: 'PATCH', headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ qty: row.qty + 1 })
        });
      }
      btn.textContent = '✓ En el carrito';
      setTimeout(function(){ btn.disabled = false; btn.textContent = '+ Agregar al carrito'; }, 1500);
    }).catch(function(){ btn.disabled = false; btn.textContent = '+ Agregar al carrito'; });
}

function prodCardHTML(p, own){
  return '<div class="card" data-pid="' + p.id + '"' + (own ? ' draggable="true"' : '') + '>'
    + '<a href="../producto/?id=' + p.id + '" style="text-decoration:none;color:inherit;display:block">'

    + '<div class="card-price">' + money(p.precio) + '</div>'
    + '<a class="buy" href="../producto/?id=' + p.id + '">Ver</a>'
    + '</div></div>';
}
function renderWallProducts(prods, own){
  var grid = document.getElementById('grid');
  if(!grid) return;
  if(!prods.length){
    if(!own) grid.innerHTML = '<div class="empty">Este vendedor aún no publica productos.</div>';
    return;
  }
  var cats = [];
  prods.forEach(function(p){ var c = p.categoria || 'General'; if(cats.indexOf(c) < 0) cats.push(c); });
  grid.className = '';
  var lupa = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="vertical-align:-2px;margin-right:6px"><circle cx="10.5" cy="10.5" r="7"></circle><line x1="16" y1="16" x2="22" y2="22"></line></svg>';
  grid.innerHTML = '<div class="catbar" id="catbar">'
    + '<button class="catchip" id="wall-search-btn">' + lupa + 'Buscar</button>'
    + '<button class="catchip on" data-cat="">Todos</button>'
    + cats.map(function(c){ return '<button class="catchip" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('')
    + '</div>'
    + '<div id="wall-search-row" style="display:none;margin-bottom:14px"><input id="wall-search" type="search" placeholder="Buscar en esta tienda..." style="width:100%;background:#ffffff;border:1px solid #d0d4da;border-radius:12px;padding:13px 15px;color:#111;font-family:inherit;font-size:15px"></div>'
    + '<div class="grid hgrid" id="wall-grid"></div>';
  var wg = document.getElementById('wall-grid');
  var curCat = '', query = '';
  var draw = function(){
    var list = prods.filter(function(p){
      if(query) return p.titulo.toLowerCase().indexOf(query.toLowerCase()) >= 0;
      return !curCat || (p.categoria || 'General') === curCat;
    });
    wg.innerHTML = list.length ? list.map(function(p){ return prodCardHTML(p, own); }).join('') : '<p style="color:#111;grid-column:1/-1;text-align:center;padding:16px">No se encontraron productos.</p>';
  };
  draw();
  var sBtn = document.getElementById('wall-search-btn');
  var sRow = document.getElementById('wall-search-row');
  var sInp = document.getElementById('wall-search');
  sBtn.onclick = function(){
    var open = sRow.style.display !== 'none';
    sRow.style.display = open ? 'none' : '';
    sBtn.classList.toggle('on', !open);
    if(open){
      query = ''; sInp.value = ''; draw();
      grid.querySelectorAll('.catchip[data-cat]').forEach(function(x){ x.classList.toggle('on', (x.dataset.cat || '') === curCat); });
    } else {
      grid.querySelectorAll('.catchip[data-cat]').forEach(function(x){ x.classList.remove('on'); });
      sInp.focus();
    }
  };
  sInp.oninput = function(){ query = sInp.value.trim(); draw(); };
  grid.querySelectorAll('.catchip[data-cat]').forEach(function(ch){
    ch.onclick = function(){
      grid.querySelectorAll('.catchip[data-cat]').forEach(function(x){ x.classList.remove('on'); });
      ch.classList.add('on');
      curCat = ch.dataset.cat || '';
      query = ''; sInp.value = '';
      sBtn.classList.remove('on'); sRow.style.display = 'none';
      draw();
    };
  });
}

function catsParaTipo(tipo){

  cats.push('Otro');

function loadCatalog(){
  var box = document.getElementById('cat-list');
  if(!box) return;
  var prods = window._prods || [];
  // Buscador
  var searchHTML = '<div style="margin-bottom:14px">'
    + '<input id="cat-search" type="search" placeholder="Buscar en este negocio..." '
    + 'style="width:100%;background:#ffffff;border:1px solid #d0d4da;border-radius:12px;padding:13px 15px;color:#111;font-family:inherit;font-size:15px">'
    + '</div><div id="cat-results"></div>';
  box.innerHTML = searchHTML;
  var results = document.getElementById('cat-results');
  var renderCats = function(filter){
    var cats = {};
    prods.forEach(function(p){
      // Filtrar por búsqueda (solo productos de esta empresa)
      if(filter && p.titulo.toLowerCase().indexOf(filter.toLowerCase()) < 0) return;
      var c = p.categoria || 'General';
      if(!cats[c]) cats[c] = [];
      cats[c].push(p);
    });
    var names = Object.keys(cats).sort();
    if(!names.length){
      results.innerHTML = '<p style="color:#111;text-align:center">No se encontraron productos.</p>';
      return;
    }
    results.innerHTML = names.map(function(c, i){
      return '<div style="margin-bottom:8px;border:1px solid #d0d4da;border-radius:14px;overflow:hidden">'
        + '<button class="cat-h" data-i="' + i + '" style="width:100%;background:#ffffff;border:0;color:#111;padding:14px 16px;font-size:15px;font-weight:700;text-align:left;cursor:pointer;font-family:inherit">' + esc(c) + ' (' + cats[c].length + ') ▾</button>'
        + '<div class="cat-b" id="cb-' + i + '" style="display:none;padding:12px"><div class="grid">'
        + cats[c].map(function(p){ return prodCardHTML(p, false); }).join('')
        + '</div></div></div>';
    }).join('');
    results.querySelectorAll('.cat-h').forEach(function(h){
      h.onclick = function(){
        var b = document.getElementById('cb-' + h.dataset.i);
        b.style.display = b.style.display === 'none' ? '' : 'none';
      };
    });
    // Si hay búsqueda, expandir todas las categorías
    if(filter){
      results.querySelectorAll('.cat-b').forEach(function(b){ b.style.display = ''; });
    }
  };
  renderCats('');
  var searchInput = document.getElementById('cat-search');
  searchInput.oninput = function(){ renderCats(searchInput.value.trim()); };
}

      + '<div style="flex:1;min-width:0"><div style="color:#111;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.titulo) + '</div>'

      + '<div class="prod-menu" id="pm-' + p.id + '" style="display:none;position:absolute;top:calc(100% - 4px);right:8px;background:#ffffff;border:1px solid #d0d4da;border-radius:12px;min-width:150px;overflow:hidden;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.55)">'

    });
    wg.querySelectorAll('[data-pedit]').forEach(function(b){ b.onclick = function(){ productModal(b.dataset.pedit, tok); }; });

function setupEditMode(){
  if(!SELLER) return;
  var sx = null; try{ sx = JSON.parse(localStorage.getItem('dominus_session')); }catch(e){}
  if(!(sx && sx.user && sx.user.id === SELLER.user_id)) return;
  var btn = document.createElement('button');
  btn.id = 'edit-toggle'; btn.textContent = 'Editar muro'; btn.style.display = 'none';
  document.body.appendChild(btn);
  // Si la vista actual es editar, mostrar el botón como "Ver como cliente"
  try{
    if(new URLSearchParams(location.search).get('view') === 'editar'){
      btn.style.display = '';
      btn.textContent = 'Ver como cliente';
    }
  }catch(e){}
  btn.onclick = function(){
    var on = document.body.classList.toggle('editing');
    btn.textContent = on ? 'Ver como cliente' : 'Editar muro';
    if(!on){
      // Descartar formularios de edición sin guardar para mostrar la versión guardada
      document.querySelectorAll('.inline-form').forEach(function(w){
        var prev = w.previousElementSibling;
        w.remove();
        if(prev) prev.style.display = '';
      });
    }
  };
  wireEditControls(sx.access_token);
  if(new URLSearchParams(location.search).get('edit') === '1') btn.click();
}
function pickNewPhoto(field, tok){
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.style.position = 'fixed'; inp.style.opacity = '0'; inp.style.pointerEvents = 'none';
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files[0]; inp.remove();
    if(!f) return;
    openCropEditor(f, field, tok);
  };
  try{ inp.click(); }catch(err){ alert('No se pudo abrir la galería.'); inp.remove(); }
}

function startInlineEdit(el, tok){
  var field = el.dataset.field;
  var isLong = (field === 'descripcion_larga');
  var current = SELLER[field] || '';
  var wrap = document.createElement('div');
  wrap.className = 'inline-form';
  wrap.innerHTML = (isLong ? '<textarea rows="4"></textarea>' : '<input type="text">')
    + '<div class="row"><button class="inline-save">Guardar</button><button class="inline-cancel" type="button">Cancelar</button></div>';
  var input = wrap.querySelector(isLong ? 'textarea' : 'input');
  input.value = current;
  el.style.display = 'none';
  el.parentNode.insertBefore(wrap, el.nextSibling);
  input.focus();
  wrap.querySelector('.inline-cancel').onclick = function(){ wrap.remove(); el.style.display = ''; };

      return '<button type="button" class="tz" data-t="' + t + '" style="' + (selTallas.indexOf(t) >= 0 ? chipOn : chip) + '">' + t + '</button>';
    }).join('') + '</div>';
    box.innerHTML = h;
    box.querySelectorAll('.zg').forEach(function(b){ b.onclick = function(){ zapGen = b.dataset.g; renderTallas(); }; });
    box.querySelectorAll('.tz').forEach(function(b){ b.onclick = function(){

  }

    ov.querySelector('#m-save').textContent = 'Guardando…';
    var files = [1, 2, 3].map(function(i){ return ov.querySelector('#m-foto' + i).files[0] || null; });

      else { url = SUPABASE_URL + '/rest/v1/products'; method = 'POST'; body.seller_id = SELLER.id; body.activo = true; body.orden = (window._prods || []).length; }

        .catch(function(){ alert('No se pudo guardar.'); ov.querySelector('#m-save').textContent = 'Guardar'; });

      return f ? uploadPhoto(f, SELLER.slug + '/prod-' + ts + '-' + i + '.jpg', tok) : Promise.resolve(existing[i]);
    })).then(done).catch(function(){ alert('No se pudo subir la foto.'); ov.querySelector('#m-save').textContent = 'Guardar'; });

function wireFeatDrag(){
  var tok = myTok();
  var grid = document.getElementById('feat-grid');
  if(!grid || !tok) return;
  var dragPid = null;
  grid.querySelectorAll('.card[data-pid]').forEach(function(card){
    card.addEventListener('dragstart', function(){ dragPid = card.dataset.pid; card.classList.add('dragging'); });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    card.addEventListener('dragover', function(e){ if(document.body.classList.contains('editing')) e.preventDefault(); });
    card.addEventListener('drop', function(e){
      e.preventDefault();
      if(!dragPid || dragPid === card.dataset.pid || !document.body.classList.contains('editing')) return;
      var cards = Array.prototype.slice.call(grid.querySelectorAll('.card[data-pid]'));
      var from = cards.find(function(c){ return c.dataset.pid === dragPid; });
      grid.insertBefore(from, card);
      var ids = Array.prototype.map.call(grid.querySelectorAll('.card[data-pid]'), function(c){ return c.dataset.pid; });
      var jobs = ids.map(function(id, i){
        return fetch(SUPABASE_URL + '/rest/v1/products?id=eq.' + id, { method: 'PATCH', headers: edH(tok), body: JSON.stringify({ orden: i }) });
      });
      Promise.all(jobs).then(function(){ reloadKeepEdit(); });
    });
  });
}

function loadTodayOrders(){
  var box = document.getElementById('today-list');
  if(!box) return;
  var tok = myTok();
  if(!tok) return;
  fetch(SUPABASE_URL + '/rest/v1/orders?seller_id=eq.' + SELLER.id + '&select=*&order=created_at.desc&limit=200', { headers: edH(tok) })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var now = new Date();
      var isToday = function(iso){ var d = new Date(iso); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate(); };
      rows = (rows || []).filter(function(o){ return isToday(o.created_at); });
      if(!rows.length){ box.innerHTML = '<p style="color:var(--mut);font-size:14px">Hoy no tienes pedidos.</p>'; return; }
      var storeKey = 'dominus_pedidos_' + SELLER.id;
      var store = { base: null, dec: {} };
      try{ store = JSON.parse(localStorage.getItem(storeKey) || 'null') || store; }catch(e){}
      var groups = [], byK = {};
      rows.forEach(function(o){
        var gk = o.paypal_order_id || ('row-' + o.id);
        if(!byK[gk]){ byK[gk] = { key: gk, items: [], buyer_id: o.buyer_id, created_at: o.created_at, paypal: o.paypal_order_id }; groups.push(byK[gk]); }
        byK[gk].items.push(o);
      });
      var buyers = {};
      groups.forEach(function(g){ buyers[g.buyer_id] = true; });
      Promise.all(Object.keys(buyers).map(function(uid){
        return fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + uid + '&select=*', { headers: edH(tok) })
          .then(function(r){ return r.json(); })
          .then(function(rs){ buyers[uid] = (rs && rs[0]) || {}; })
          .catch(function(){ buyers[uid] = {}; });
      })).then(function(){
        box.innerHTML = groups.map(function(g){
          var aceptado = store.dec[g.key] === 'aceptado';
          var total = g.items.reduce(function(s, o){ return s + Number(o.precio) * o.qty; }, 0);
          var d = new Date(g.created_at);
          var hora = d.toLocaleTimeString('es-NI', { hour: 'numeric', minute: '2-digit' });
          var pr = buyers[g.buyer_id] || {};
          var dir = [pr.direccion, pr.ciudad, pr.departamento].filter(Boolean).join(', ');
          return '<div class="today-card' + (aceptado ? '' : ' pend') + '">'
            + '<div class="today-head"><span>' + esc(hora) + (g.paypal ? ' \u00B7 PayPal ' + esc(g.paypal) : '') + '</span><span class="today-chip">' + (aceptado ? 'Aceptado' : 'Sin aceptar') + '</span></div>'
            + g.items.map(function(o){
                return '<div class="today-item"><span><b>' + esc(o.titulo) + '</b>' + (o.talla ? '<small> \u00B7 Talla ' + esc(o.talla) + '</small>' : '') + '<br><small>' + o.qty + ' \u00D7 ' + money(o.precio) + '</small></span><b>' + money(Number(o.precio) * o.qty) + '</b></div>';
              }).join('')
            + '<div class="today-total"><span>Total</span><b>' + money(total) + '</b></div>'
            + '<p class="today-buyer">Tel: ' + esc(pr.telefono || 'Sin registrar') + (dir ? ' \u00B7 ' + esc(dir) : '') + '</p>'
            + (aceptado ? '' : '<button class="today-accept" data-accept="' + esc(g.key) + '">Aceptar</button>')
            + '</div>';
        }).join('');
        box.querySelectorAll('[data-accept]').forEach(function(b){
          b.onclick = function(){
            markAcceptedDB(b.dataset.accept, tok);
            store.dec[b.dataset.accept] = 'aceptado';
            try{ localStorage.setItem(storeKey, JSON.stringify(store)); }catch(e){}
            loadTodayOrders();
          };
        });
      });
    }).catch(function(){ box.innerHTML = '<p style="color:var(--mut);font-size:14px">No se pudo cargar.</p>'; });
}
function markAcceptedDB(gk, tok){
  var q;
  if(gk.indexOf('row-') === 0){ q = 'id=eq.' + encodeURIComponent(gk.slice(4)); }
  else { q = 'seller_id=eq.' + SELLER.id + '&paypal_order_id=eq.' + encodeURIComponent(gk); }
  fetch(SUPABASE_URL + '/rest/v1/orders?' + q, {
    method: 'PATCH', headers: edH(tok),
    body: JSON.stringify({ estado: 'aceptado', estado_at: new Date().toISOString() })
  }).catch(function(){});
}
function checkNewOrders(tok){
  fetch(SUPABASE_URL + '/rest/v1/orders?seller_id=eq.' + SELLER.id + '&select=*&order=created_at.desc&limit=50', { headers: edH(tok) })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(!rows || !rows.length) return;
      var storeKey = 'dominus_pedidos_' + SELLER.id;
      var store = { base: null, dec: {} };
      try{ store = JSON.parse(localStorage.getItem(storeKey) || 'null') || store; }catch(e){}
      if(!store.base){
        store.base = new Date().toISOString();
        try{ localStorage.setItem(storeKey, JSON.stringify(store)); }catch(e){}
        return;
      }
      var base = new Date(store.base);
      var groups = [], byK = {};
      rows.forEach(function(o){
        if(new Date(o.created_at) <= base) return;
        var gk = o.paypal_order_id || ('row-' + o.id);
        if(store.dec[gk]) return;
        if(!byK[gk]){ byK[gk] = { key: gk, items: [], buyer_id: o.buyer_id, created_at: o.created_at, paypal: o.paypal_order_id }; groups.push(byK[gk]); }
        byK[gk].items.push(o);
      });
      if(!groups.length) return;
      groups.sort(function(a, b){ return new Date(a.created_at) - new Date(b.created_at); });
      showOrderNotice(groups, store, storeKey, tok);
    }).catch(function(){});
}
function showOrderNotice(groups, store, storeKey, tok){

  fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + g.buyer_id + '&select=*', { headers: edH(tok) })
    .then(function(r){ return r.json(); })
    .then(function(rows){ paint((rows && rows[0]) || {}); })
    .catch(function(){ paint({}); });
  function paint(pr){
    var total = g.items.reduce(function(s, o){ return s + Number(o.precio) * o.qty; }, 0);
    var d = new Date(g.created_at);
    var fecha = d.toLocaleDateString('es-NI', { day: 'numeric', month: 'long' }) + ' · ' + d.toLocaleTimeString('es-NI', { hour: 'numeric', minute: '2-digit' });

    var ov = document.createElement('div');
    ov.className = 'ord-ov';
    ov.innerHTML =
      '<button class="ord-x" id="ord-x" aria-label="Rechazar">\u2715</button>'
      + '<span class="ord-tag">Nuevo pedido</span>'
      + '<h2 class="ord-h">\u00A1Tienes un pedido nuevo!</h2>'
      + '<p class="ord-fecha">' + esc(fecha) + (g.paypal ? ' \u00B7 Orden PayPal ' + esc(g.paypal) : '') + '</p>'
      + '<div class="ord-items">' + g.items.map(function(o){
          return '<div class="ord-item"><div><b>' + esc(o.titulo) + '</b>' + (o.talla ? '<small> \u00B7 Talla ' + esc(o.talla) + '</small>' : '') + '<br><small>' + o.qty + ' \u00D7 ' + money(o.precio) + '</small></div><b>' + money(Number(o.precio) * o.qty) + '</b></div>';
        }).join('') + '</div>'
      + '<div class="ord-total"><span>Total</span><b>' + money(total) + '</b></div>'
      + '<div class="ord-buyer"><h3>Datos para la entrega</h3>'
      + '<p><b>Tel\u00E9fono:</b> ' + esc(pr.telefono || 'Sin registrar') + '</p>'
      + '<p><b>Direcci\u00F3n:</b> ' + esc(dir || 'Sin registrar') + '</p></div>'
      + '<p class="ord-note">Prepara el producto: pasar\u00E1 un delivery a recogerlo.</p>'
      + (groups.length > 1 ? '<p class="ord-more">Al cerrar este quedan ' + (groups.length - 1) + ' pedido(s) m\u00E1s por revisar.</p>' : '')
      + '<button class="ord-accept" id="ord-ok">Aceptar</button>';
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    function decide(val){
      if(val === 'aceptado') markAcceptedDB(g.key, tok);
      store.dec[g.key] = val;
      try{ localStorage.setItem(storeKey, JSON.stringify(store)); }catch(e){}
      ov.remove();
      document.body.style.overflow = '';
      groups.shift();
      if(groups.length) showOrderNotice(groups, store, storeKey, tok);
    }
    ov.querySelector('#ord-x').onclick = function(){ decide('omitido'); };
    ov.querySelector('#ord-ok').onclick = function(){ decide('aceptado'); };
  }
}
function loadSales(tok){
  var box = document.getElementById('sales-list');
  if(!box) return;
  fetch(SUPABASE_URL + '/rest/v1/orders?seller_id=eq.' + SELLER.id + '&select=titulo,precio,qty,created_at&order=created_at.desc&limit=200',
    { headers: edH(tok) })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(!rows || !rows.length){ box.innerHTML = '<p style="color:var(--mut);font-size:14px">A\u00FAn no tienes ventas.</p>'; return; }
      var total = rows.reduce(function(s, o){ return s + Number(o.precio) * o.qty; }, 0);
      var groups = [], byKey = {};
      rows.forEach(function(o){
        var d = new Date(o.created_at);
        var k = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
        if(!byKey[k]){
          var lbl = d.toLocaleDateString('es', { month: 'long', year: 'numeric' });
          byKey[k] = { label: lbl.charAt(0).toUpperCase() + lbl.slice(1), items: [], total: 0 };
          groups.push(byKey[k]);
        }
        byKey[k].items.push(o);
        byKey[k].total += Number(o.precio) * o.qty;
      });
      var rowHTML = function(o){
        var d = new Date(o.created_at);
        var f = d.toLocaleDateString('es-NI', { day:'numeric', month:'short' });
        return '<div class="edit-row"><label>' + esc(o.titulo) + ' <small style="color:var(--mut)">(' + f + ')</small></label>'
          + '<span style="flex:1;text-align:right;font-size:15px">' + o.qty + ' \u00D7 ' + money(o.precio) + ' = <b>' + money(Number(o.precio) * o.qty) + '</b></span></div>';
      };
      box.innerHTML = '<p style="font-size:14px;color:var(--mut);margin-bottom:12px">Total vendido: <b style="color:var(--txt)">' + money(total) + '</b></p>'
        + groups.map(function(g){
          return '<div style="background:#eef0f3;border:1px solid #d0d4da;border-radius:10px;padding:9px 13px;margin:16px 0 8px;font-size:14px;color:#111"><b>' + esc(g.label) + '</b> · ' + money(g.total) + ' del mes · ' + g.items.length + (g.items.length === 1 ? ' venta' : ' ventas') + '</div>'
            + g.items.map(rowHTML).join('');
        }).join('');
    })
    .catch(function(){ box.innerHTML = '<p style="color:var(--mut);font-size:14px">No se pudo cargar.</p>'; });
}
function loadEditPanel(tok){
  var box = document.getElementById('ep-fields');
  if(!box) return;
  fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + SELLER.user_id + '&select=direccion,ciudad,departamento,pais,telefono,referencia,foto_referencia',
    { headers: edH(tok) })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var p = (rows && rows[0]) || {};
      function row(id, name, val, ph, type){
        var label = (val ? 'Modificar ' : 'Agregar ') + name;
        return '<div class="edit-row"><label>' + label + '</label>'
          + '<input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(val || '') + '" placeholder="' + ph + '"></div>';
      }
      var tiposOpts = TIPOS_EMPRESA.map(function(tp){
          return '<option value="' + esc(tp) + '"' + (SELLER.tipo_empresa === tp ? ' selected' : '') + '>' + esc(tp) + '</option>';
        }).join('');
      box.innerHTML =
        row('ep-nombre', 'Nombre del negocio', SELLER.nombre, 'Ej: Mi Tienda')
        + '<div class="edit-row"><label>Tipo de empresa</label>'
        + '<select id="ep-tipo" style="flex:1;background:#ffffff;border:1px solid #d0d4da;border-radius:12px;padding:13px 15px;color:#111;font-family:inherit;font-size:15px;min-width:0">'
        + '<option value="">Seleccionar...</option>' + tiposOpts + '</select></div>'
        + row('ep-wa', 'WhatsApp', SELLER.whatsapp, 'Ej: 50588888888', 'tel')
        + row('ep-pp', 'PayPal', SELLER.paypal_email, 'Correo de PayPal', 'email')
        + '<details><summary>Datos de env\u00EDo</summary>'

        + '<div class="inline-form"><label>Dirección *</label><textarea id="ep-ref" rows="2" placeholder="Ej: Costado norte del estadio, casa azul">' + esc(p.referencia || '') + '</textarea></div>'
        + (p.foto_referencia ? '<br><img src="' + p.foto_referencia + '" style="max-width:200px;border-radius:8px;margin-top:8px">' : '') + '</div>'
        + row('ep-ciu', 'Ciudad *', p.ciudad, 'Ej: Managua')
        + row('ep-dep', 'Departamento *', p.departamento, 'Ej: Managua')
        + row('ep-pais', 'Pa\u00EDs *', p.pais, 'Ej: Nicaragua')
        + '<div class="inline-form"><label>Foto de referencia</label><input id="ep-foto-ref" type="file" accept="image/*">'
        + (p.foto_referencia ? '<br><img src="' + p.foto_referencia + '" style="max-width:200px;border-radius:8px;margin-top:8px">' : '') + '</div>'

        + '</details>'
        + '<button class="inline-save" id="ep-save">Guardar cambios</button>';
      document.getElementById('ep-save').onclick = function(){
        var btn = this; btn.textContent = 'Guardando\u2026'; btn.disabled = true;
        var sp = {
          nombre: document.getElementById('ep-nombre').value.trim() || SELLER.nombre,
          tipo_empresa: document.getElementById('ep-tipo').value || null,
          whatsapp: document.getElementById('ep-wa').value.trim() || null,
          paypal_email: document.getElementById('ep-pp').value.trim() || null
        };
        var dirV = document.getElementById('ep-ref').value.trim();
        var ciuV = document.getElementById('ep-ciu').value.trim();
        var depV = document.getElementById('ep-dep').value.trim();
        var paiV = document.getElementById('ep-pais').value.trim();
        if(!dirV || !ciuV || !depV || !paiV){
          alert('Completa dirección, ciudad, departamento y país (son obligatorios).');
          btn.textContent = 'Guardar cambios'; btn.disabled = false; return;
        }
        var pr = {
          ciudad: ciuV,
          departamento: depV,
          pais: paiV,

          referencia: document.getElementById('ep-ref').value.trim() || null
        };
        var fotoFile = document.getElementById('ep-foto-ref').files[0];
        var doSave = function(){
          var spTry = Object.assign({}, sp);
          var saveSellers = function(retried){
            return fetch(SUPABASE_URL + '/rest/v1/sellers?id=eq.' + SELLER.id, {
              method: 'PATCH', headers: edH(tok), body: JSON.stringify(spTry)
            }).then(function(r){
              if(!r.ok && !retried && spTry.tipo_empresa !== undefined){
                // Reintentar sin tipo_empresa (la columna puede no existir aún)
                delete spTry.tipo_empresa;
                return saveSellers(true);
              }
              if(!r.ok) throw new Error('Error en datos del negocio (' + r.status + ')');
            });
          };
          saveSellers(false).then(function(){
            // Intentar PATCH primero, si no existe el perfil hacer POST
            return fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + SELLER.user_id, {
              method: 'PATCH', headers: edH(tok), body: JSON.stringify(pr)
            }).then(function(r){
              if(r.ok) return;
              // Si PATCH falla, intentar crear con POST
              var prNew = Object.assign({ user_id: SELLER.user_id, tipo: 'vendedor' }, pr);
              return fetch(SUPABASE_URL + '/rest/v1/profiles', {
                method: 'POST', headers: edH(tok), body: JSON.stringify(prNew)
              }).then(function(r2){
                if(!r2.ok) throw new Error('Error en datos de envío (' + r2.status + ')');
              });
            });
          }).then(function(){
            // La ubicación del muro sale de los datos de envío: solo ciudad y país
            return fetch(SUPABASE_URL + '/rest/v1/sellers?id=eq.' + SELLER.id, {
              method: 'PATCH', headers: edH(tok),
              body: JSON.stringify({ ubicacion: (ciuV && paiV) ? (ciuV + ', ' + paiV) : null })
            }).catch(function(){});
          }).then(function(){
            btn.textContent = '\u2713 Guardado';
            setTimeout(function(){ reloadKeepEdit(); }, 800);
          }).catch(function(e){
            btn.textContent = 'Guardar cambios'; btn.disabled = false;
            var msg = 'No se pudo guardar.';
            if(e && e.message) msg += ' ' + e.message;
            alert(msg + ' Intenta de nuevo.');
          });
        };
        if(fotoFile){
          var ext = (fotoFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
          var path = 'referencias/' + SELLER.user_id + '-' + Date.now() + '.' + ext;
          fetch(SUPABASE_URL + '/storage/v1/object/product-images/' + path, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + tok, 'Content-Type': fotoFile.type || 'image/jpeg' },
            body: fotoFile
          }).then(function(r){ if(!r.ok) throw 0; return SUPABASE_URL + '/storage/v1/object/public/product-images/' + path; })
          .then(function(url){ pr.foto_referencia = url; doSave(); })
          .catch(function(){ doSave(); });
          return;
        }
        doSave();
      };
    })
    .catch(function(){ box.innerHTML = '<p style="color:var(--mut);font-size:14px">No se pudo cargar.</p>'; });
}
/* ===== editor de foto: mover + agrandar/achicar ===== */
function openCropEditor(source, field, tok){
  var img = new Image();
  img.crossOrigin = 'anonymous';
  var url, revoke, origFile = null;
  if(typeof source === 'string'){ url = source; revoke = false; }
  else { url = URL.createObjectURL(source); revoke = true; origFile = source; }
  img.onload = function(){ buildCropEditor(img, url, field === 'cover_url', field, tok, revoke, origFile); };
  img.onerror = function(){ if(revoke) URL.revokeObjectURL(url); alert('No se pudo leer la imagen.'); };
  img.src = url;
}
function buildCropEditor(img, objUrl, isCover, field, tok, revoke, origFile){
  var aspect = 1;
  if(isCover){
    var cov = document.querySelector('.cover');
    if(cov && cov.clientHeight > 0) aspect = cov.clientWidth / cov.clientHeight;
    else aspect = window.innerWidth / 220;
    aspect = Math.max(1.2, Math.min(4, aspect));
  }
  var ov = document.createElement('div');
  ov.className = 'modal-ov';
  ov.innerHTML = '<div class="modal"><h3>' + (isCover ? 'Ajustar portada' : 'Ajustar foto de perfil') + '</h3>'
    + '<p style="font-size:13px;color:var(--mut);margin:6px 0 12px"><b style="color:var(--txt)">1.</b> Agranda la foto con la barra <b style="color:var(--txt)">2.</b> Arrastrala para acomodarla</p>'
    + '<div class="crop-frame" style="aspect-ratio:' + aspect + '/1' + (isCover ? '' : ';border-radius:50%;max-width:320px;margin:0 auto') + '"><img id="crop-img" src="' + objUrl + '"></div>'
    + '<div class="crop-zoom"><button id="z-out" type="button">−</button><input type="range" id="z-range" min="1" max="3" step="0.01" value="1"><button id="z-in" type="button">＋</button></div>'
    + '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:-2px 54px 10px"><span>achicar</span><span>agrandar</span></div>'
    + '<div class="row"><button class="inline-save" id="crop-save">Guardar</button><button class="inline-cancel" id="crop-cancel" type="button">Cancelar</button></div></div>';
  document.body.appendChild(ov);
  var frame = ov.querySelector('.crop-frame'), cimg = ov.querySelector('#crop-img');
  var range = ov.querySelector('#z-range');
  var z = 1, dx = 0, dy = 0;
  function applyT(){
    var fw = frame.clientWidth, fh = frame.clientHeight;
    if(!fw || !fh) return;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var s0 = Math.max(fw / iw, fh / ih);
    cimg.style.width = (iw * s0) + 'px';
    cimg.style.height = (ih * s0) + 'px';
    var mx = Math.max(0, (iw * s0 * z - fw) / 2), my = Math.max(0, (ih * s0 * z - fh) / 2);
    dx = Math.min(mx, Math.max(-mx, dx));
    dy = Math.min(my, Math.max(-my, dy));
    cimg.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + z + ')';
  }
  function close(){ if(revoke) URL.revokeObjectURL(objUrl); ov.remove(); }
  ov.querySelector('#crop-cancel').onclick = close;
  var dragging = false, sx = 0, sy = 0, sdx = 0, sdy = 0;
  function dStart(x, y){ dragging = true; sx = x; sy = y; sdx = dx; sdy = dy; }
  function dMove(x, y){ if(!dragging) return; dx = sdx + (x - sx); dy = sdy + (y - sy); applyT(); }
  function dEnd(){ dragging = false; }
  frame.addEventListener('touchstart', function(e){ var t = e.touches[0]; dStart(t.clientX, t.clientY); e.preventDefault(); }, {passive:false});
  frame.addEventListener('touchmove', function(e){ var t = e.touches[0]; dMove(t.clientX, t.clientY); e.preventDefault(); }, {passive:false});
  frame.addEventListener('touchend', dEnd);
  frame.addEventListener('touchcancel', dEnd);
  frame.addEventListener('mousedown', function(e){ dStart(e.clientX, e.clientY); });
  frame.addEventListener('mousemove', function(e){ dMove(e.clientX, e.clientY); });
  frame.addEventListener('mouseup', dEnd);
  frame.addEventListener('mouseleave', dEnd);
  range.addEventListener('input', function(){ z = parseFloat(range.value); applyT(); });
  ov.querySelector('#z-in').onclick = function(){ z = Math.min(3, z + 0.25); range.value = z; applyT(); };
  ov.querySelector('#z-out').onclick = function(){ z = Math.max(1, z - 0.25); range.value = z; applyT(); };
  window.addEventListener('resize', applyT);
  // esperar layout
  setTimeout(applyT, 50); setTimeout(applyT, 300);
  ov.querySelector('#crop-save').onclick = function(){
    var outW = isCover ? 1200 : 600, outH = isCover ? Math.round(1200 / aspect) : 600;
    var imgRect = cimg.getBoundingClientRect();
    var frameRect = frame.getBoundingClientRect();
    var scale = imgRect.width / img.naturalWidth;
    var sx = (frameRect.left - imgRect.left) / scale;
    var sy = (frameRect.top - imgRect.top) / scale;
    var sw = frameRect.width / scale, sh = frameRect.height / scale;
    sx = Math.max(0, Math.min(img.naturalWidth - sw, sx));
    sy = Math.max(0, Math.min(img.naturalHeight - sh, sy));
    var canvas = document.createElement('canvas');
    canvas.width = outW; canvas.height = outH;
    canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
    ov.querySelector('#crop-save').textContent = 'Guardando…';
    canvas.toBlob(function(blob){
      if(!blob){ alert('No se pudo procesar la imagen.'); return; }
      var ts = Date.now();
      var cropPath = SELLER.slug + '/' + field + '-' + ts + '.jpg';
      function fail(){ alert('No se pudo subir la foto. Intenta de nuevo.'); ov.querySelector('#crop-save').textContent = 'Guardar'; }
      if(origFile){
        var ext = (origFile.name && origFile.name.split('.').pop()) || 'jpg';
        var origPath = SELLER.slug + '/' + field + '-orig-' + ts + '.' + ext;
        uploadPhoto(origFile, origPath, tok).then(function(origUrl){
          return uploadPhoto(blob, cropPath, tok).then(function(cropUrl){
            var p = {}; p[field] = cropUrl; p[field + '_orig'] = origUrl;
            return patchSeller(p, tok);
          });
        }).catch(fail);
      } else {
        uploadPhoto(blob, cropPath, tok).then(function(cropUrl){
          var p = {}; p[field] = cropUrl;
          return patchSeller(p, tok);
        }).catch(fail);
      }
    }, 'image/jpeg', 0.85);
  };
}
function routeMiCuenta(tipo, slug){
  if(tipo === 'vendedor' && slug){ location.href = '/Dominus/vendedor/index.html?s=' + encodeURIComponent(slug) + '&edit=1'; }
  else if(tipo === 'vendedor'){ location.href = '/Dominus/vendedor/cuenta.html'; }
  else { location.href = '/Dominus/comprador/perfil.html'; }
}
function goMiCuenta(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(!(s && s.access_token)) return true;

    var uid = (s.user && s.user.id) || null;
    if(!uid) return true;
    var H = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token };
    fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + uid + '&select=tipo,es_admin', { headers: H })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(rows && rows[0] && rows[0].es_admin){ try{ localStorage.removeItem('dominus_tipo'); localStorage.removeItem('dominus_slug'); }catch(e){} location.href = '/Dominus/admin.html'; return; }
      var t = (rows && rows[0] && rows[0].tipo) || 'comprador';
      try{ localStorage.setItem('dominus_tipo', t); }catch(e){}
      if(t === 'vendedor'){
        fetch(SUPABASE_URL + '/rest/v1/sellers?user_id=eq.' + uid + '&select=slug', { headers: H })
        .then(function(r){ return r.json(); })
        .then(function(r2){
          var sl = (r2 && r2[0] && r2[0].slug) || null;
          if(sl){ try{ localStorage.setItem('dominus_slug', sl); }catch(e){} }
          routeMiCuenta(t, sl);
        }).catch(function(){ routeMiCuenta(t, null); });
      } else {
        routeMiCuenta(t, null);
      }
    }).catch(function(){ location.href = '/Dominus/cuenta.html'; });
    return false;
  }catch(e){ return true; }
}
function doLogout(){
  try{
    localStorage.removeItem('dominus_session');
    localStorage.removeItem('dominus_tipo');
    localStorage.removeItem('dominus_slug');
  }catch(e){}
  location.href = '/Dominus/index.html';
  return false;
}
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(s && s.access_token){
      var b = document.getElementById('menu-logout');
      if(b) b.style.display = 'block';
    }
  }catch(e){}
})();
