<html lang="es">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef0f3;--card:#ffffff;--line:#e2e5ea;--txt:#111111;--mut:#5a6270;--acc:#4a4a52;--err:#ff5d5d}
body{background:#ffffff;background-attachment:fixed;color:#111111;font-family:'Source Sans 3',Archivo,Arial,sans-serif;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#2a2a2e;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;text-decoration:none;flex:0 0 auto;color:#111111!important}
.logo em{font-style:normal;color:var(--acc)}
.top-actions{display:flex;gap:10px;align-items:center;margin-left:auto}
.link{color:var(--mut);text-decoration:none;font-size:13px}
.logout{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:26px 18px 70px}
.profile-card{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:22px}
.avatar{flex:0 0 64px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#7c5cff);display:grid;place-content:center;font-weight:900;font-size:26px;color:#fff}
.profile-card h1{font-size:20px}
.profile-card small{color:var(--mut);font-size:13px}
.welcome{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px}
.welcome h1{font-size:26px;font-weight:900}
.welcome h1 .hl{color:var(--acc)}
.wall-link{display:inline-block;background:var(--card);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:13px;font-weight:700;padding:10px 20px;border-radius:999px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 30px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--acc)}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:22px}
.sec h2{font-size:19px;margin-bottom:14px}
.acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;font-family:inherit;font-size:19px;font-weight:800;color:var(--txt);cursor:pointer;padding:0;text-align:left}
.acc-body{display:none;margin-top:16px}
.sec.open .acc-body{display:block}
.acc-chev{color:var(--mut);font-size:15px;transition:transform .2s ease;flex:0 0 auto}
.sec.open .acc-chev{transform:rotate(180deg)}
.acc-note{font-size:13px;color:var(--mut);margin-bottom:14px}
.aj-group{background:#f7f8fa;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.aj-group:last-child{margin-bottom:0}
.dir-card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#f7f8fa}
.dir-card.prin{border-color:#2a2a2e}
.dir-badge{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:#2a2a2e;color:#fff;white-space:nowrap}
.dir-ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dir-op{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--txt)}
.dir-op.danger{color:#b3261e;border-color:#e5b4b0}
.dir-check{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0 4px;background:#f7f8fa}
.dir-opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;cursor:pointer;margin-bottom:8px;color:var(--txt)}
.dir-opt.sel{border-color:#2a2a2e;background:#eceff3}
.aj-h{font-size:15px;font-weight:800;margin-bottom:10px}
.sec h2 .hl{color:var(--acc)}
.item{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#161b24;flex:0 0 64px}
.item .info{flex:1;min-width:0}
.item .info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info small{color:var(--mut);font-size:12px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;cursor:pointer;font-family:inherit}
.qty b{min-width:20px;text-align:center}
.item .pa{font-weight:900;color:var(--acc);min-width:70px;text-align:right}
.rm{background:none;border:0;color:var(--mut);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline}
.total{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:18px;font-weight:900}
.total span:last-child{color:var(--acc);font-size:24px}
.btn{display:block;width:100%;background:var(--acc);color:#0a0c10;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;padding:14px;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}
.btn-wa{background:#22c55e}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:24px}
.sell-box{text-align:center;font-size:14px;color:var(--mut)}
.sell-box a{color:var(--acc);font-weight:700;text-decoration:none}
.err{display:none;background:rgba(255,93,93,.12);border:1px solid var(--err);color:#b3261e;font-size:13px;border-radius:12px;padding:11px 14px;margin-top:14px}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;padding:22px}

/* ===== plateado metálico ===== */
.hl,.logo em{background:linear-gradient(120deg,#ffffff 0%,#c2c9d4 35%,#f4f6f9 55%,#98a2b1 80%,#e8ecf1 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.btn:not(.btn-ghost):not(.btn-wa),.buy,.hero-search button{background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%)!important;color:#0a0c10!important;border:0!important}
.card-price,.pd-price{background:linear-gradient(120deg,#ffffff,#c2c9d4 40%,#f4f6f9 60%,#98a2b1)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}

.menu-wrap{position:relative;margin-left:auto}
#menu-btn{background:none;border:1px solid var(--line);color:#f2f4f8;font-size:20px;border-radius:12px;padding:8px 13px;cursor:pointer;font-family:inherit}
.menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:200px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.16);z-index:50}
.menu.open{display:block}
.menu a{display:block;padding:14px 20px;text-decoration:none;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);color:#111111}
.menu a:last-child{border-bottom:0}
.menu a:hover{background:rgba(0,0,0,.05)}
body{display:flex;flex-direction:column;min-height:100vh}footer{margin-top:auto}
.passwrap{position:relative}
.passwrap input{padding-right:74px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#4a4a52;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;padding:6px 8px}
</style>
</head>

<script>
var SUPABASE_URL = "https://mmmkwkjzfyijnffniykt.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbWt3a2p6Znlpam5mZm5peWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTIzNDUsImV4cCI6MjEwNzY2ODM0NX0.xa-0G0E1vbGZGUvfvWsAMS9vNdg17pR68ee-kU8aur4";
var PAYPAL_CLIENT_ID = "BAAxRwrBgVX0LQCQlIC6qPmtzh-87LsKLBvcSlTcXQRqOEJNUhpzNhCdzw-l25nJnuIsJi_8d-uhBBx2mY";
/* sesión persistente: renueva el token automáticamente */
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(!s || !s.access_token || !s.refresh_token) return;
    var exp = 0;
    if(s.expires_at) exp = s.expires_at * 1000;
    else { try{ exp = JSON.parse(atob(s.access_token.split('.')[1])).exp * 1000; }catch(e){} }
    if(!exp || Date.now() < exp - 120000) return;
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function(r){ return r.json(); }).then(function(ns){
      if(ns && ns.access_token){ localStorage.setItem('dominus_session', JSON.stringify(ns)); location.reload(); }
      else localStorage.removeItem('dominus_session');
    }).catch(function(){});
  }catch(e){}
})();

var WA_NUMBER = "15704698339";
var session = null, cart = [];
function getSession(){ try { return JSON.parse(localStorage.getItem('dominus_session')); } catch(e){ return null; } }
function h(token){
  return { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n){ return '$' + Number(n).toFixed(2); }

function deleteMyAccountBuyer(){
  if(!session || !session.access_token){ alert('Entra a tu cuenta primero.'); return; }
  if(!confirm('¿Eliminar tu cuenta de Dominus?\n\nSe borrará tu perfil, tu carrito y tu cuenta de acceso. Esto NO se puede deshacer.')) return;
  var frase = prompt('Para confirmar, escribe ELIMINAR:');
  if(!frase || frase.trim().toUpperCase() !== 'ELIMINAR'){ alert('Cancelado. Tu cuenta sigue activa.'); return; }
  var tok = session.access_token, uid = session.user.id;
  var finish = function(completa){
    try{ localStorage.removeItem('dominus_session'); localStorage.removeItem('dominus_tipo'); localStorage.removeItem('dominus_slug'); }catch(e){}
    alert(completa ? 'Tu cuenta fue eliminada.' : 'Tu perfil y tu carrito fueron eliminados.');
    location.href = '../index.html';
  };
  fetch(SUPABASE_URL + '/rest/v1/rpc/eliminar_mi_cuenta', { method: 'POST', headers: h(tok), body: JSON.stringify({}) })
    .then(function(r){
      if(r.ok){ finish(true); return; }
      fetch(SUPABASE_URL + '/rest/v1/cart_items?user_id=eq.' + uid, { method: 'DELETE', headers: h(tok) })
        .then(function(){ return fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + uid, { method: 'DELETE', headers: h(tok) }); })
        .then(function(){ finish(false); })
        .catch(function(){ alert('No se pudo eliminar. Intenta de nuevo.'); });
    })
    .catch(function(){ alert('No se pudo eliminar. Revisa tu conexión.'); });
}
function renderPayPalButtons(total){
  var cont = document.getElementById('paypal-button-container');
  if(!cont || !cart.length) return;
  var missing = cart.some(function(it){ return !(it.products.sellers && it.products.sellers.paypal_email); });
  if(missing){
    cont.innerHTML = '<p style="font-size:13px;color:#f0a35e;text-align:center">Un vendedor aún no configura su PayPal. Contáctanos por WhatsApp para completar tu compra.</p>';
    return;
  }
  function init(){
    if(typeof paypal === 'undefined'){ setTimeout(init, 300); return; }
    cont.innerHTML = '';
    paypal.Buttons({
      style: { layout: 'vertical', color: 'silver', shape: 'pill', label: 'buynow' },
      createOrder: function(data, actions){
        return actions.order.create({
          purchase_units: [{ amount: { value: total.toFixed(2), currency_code: 'USD' }, description: 'Compra en Dominus' + (_prof && _prof.direccion ? ' · Entrega: ' + _prof.direccion + (_prof.ciudad ? ', ' + _prof.ciudad : '') : '') }]
        });
      },
      onApprove: function(data, actions){
        return actions.order.capture().then(function(details){
          saveOrders(data.orderID);
          clearCart();
          document.getElementById('main').innerHTML = '<div class="sec" style="text-align:center;padding:40px 20px">'
            + '<div style="font-size:52px">\u2705</div>'
            + '<h2>\u00A1Pago completado!</h2>'
            + '<p style="color:var(--mut)">Gracias ' + esc((details.payer.name || {}).given_name || '') + '. Tu pago de ' + money(total) + ' fue recibido por PayPal.<br>Coordinamos el env\u00EDo con cada vendedor.</p>'
            + '<a class="btn" href="../index.html" style="margin-top:16px;display:inline-block">Seguir explorando</a></div>';
        });
      },
      onError: function(err){ console.error('PayPal error:', err); alert('Hubo un problema con PayPal. Intenta de nuevo.'); }
    }).render('#paypal-button-container');
  }
  if(typeof paypal === 'undefined'){
    var s = document.createElement('script');
    s.src = 'https://www.paypal.com/sdk/js?client-id=' + PAYPAL_CLIENT_ID + '&currency=USD&intent=capture';
    s.onload = init;
    document.head.appendChild(s);
  } else { init(); }
}
function clearCart(){
  if(!session) return;
  fetch(SUPABASE_URL + '/rest/v1/cart_items?user_id=eq.' + session.user.id, {
    method: 'DELETE', headers: h(session.access_token)
  }).catch(function(){});
  cart = [];
}
var _prof = null;
// Construye el enlace de WhatsApp del pedido incluyendo los datos de entrega
// del comprador (Mis datos de envío). Se llama en render() y se refresca
// cuando loadShipForm() termina de cargar _prof (carga asíncrona).
function waOrderURL(){
  var nm = (session && session.user && session.user.user_metadata && session.user.user_metadata.nombre) || 'Comprador';
  var lines = cart.map(function(it){ return '• ' + it.products.titulo + (it.talla ? ' · Talla ' + it.talla : '') + ' x' + it.qty + ' (' + money(Number(it.products.precio) * it.qty) + ') — ' + it.products.sellers.nombre; });
  var subtotal = cart.reduce(function(s, it){ return s + Number(it.products.precio) * it.qty; }, 0);
  var total = calcFees(subtotal).total;
  var msg = 'Hola Dominus, mi pedido:\n' + lines.join('\n') + '\nTotal: ' + money(total);
  var p = _prof || {};
  var dir = [p.direccion, [p.ciudad, p.departamento].filter(Boolean).join(', '), p.pais].filter(Boolean);
  if(dir.length || p.telefono){
    msg += '\n\nEntrega: ' + nm;
    if(dir.length) msg += '\n' + dir.join('\n');
    if(p.referencia) msg += '\nReferencia: ' + p.referencia;
    if(p.telefono) msg += '\nContacto: ' + p.telefono;
  } else {
    msg += '\n\n(⚠️ Aún no tengo datos de entrega registrados en Dominus — los completo en "Direcciones")';
  }
  return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
}
/* ===== Libreta de direcciones: varias direcciones, una principal ===== */
var _dirs = null, _dirSelId = null, _profBase = null;
function currentDir(){
  if(!_dirs || !_dirs.length) return null;
  var s = null, pr = null;
  _dirs.forEach(function(a){ if(a.id === _dirSelId) s = a; if(a.principal) pr = a; });
  return s || pr || _dirs[0];
}
function applyDirToProf(){
  var a = currentDir();
  if(a){
    var b = _profBase || {};
    _prof = { nombre: a.nombre || b.nombre || null, direccion: a.direccion || null, ciudad: a.ciudad || null, departamento: a.departamento || null, pais: a.pais || null, telefono: a.telefono || b.telefono || null, referencia: a.referencia || null };
  }
  var wb = document.getElementById('wa-order');
  if(wb) wb.href = waOrderURL();
  renderCheckoutDir();
}
function mirrorPrincipal(a){
  var body = { direccion: a.direccion || null, ciudad: a.ciudad || null, departamento: a.departamento || null, pais: a.pais || null };
  fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + session.user.id, { method: 'PATCH', headers: h(session.access_token), body: JSON.stringify(body) }).catch(function(){});
  fetch(SUPABASE_URL + '/rest/v1/sellers?user_id=eq.' + session.user.id, { method: 'PATCH', headers: h(session.access_token), body: JSON.stringify({ ubicacion: (a.ciudad && a.pais) ? (a.ciudad + ', ' + a.pais) : null }) }).catch(function(){});
}
function loadShipForm(){
  var tok = session.access_token, uid = session.user.id;
  var profP = fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + uid + '&select=nombre,direccion,ciudad,departamento,pais,telefono,referencia', { headers: h(tok) })
    .then(function(r){ return r.json(); })
    .then(function(rows){ _profBase = (rows && rows[0]) || {}; if(!_prof) _prof = _profBase; })
    .catch(function(){ _profBase = _profBase || {}; });
  fetch(SUPABASE_URL + '/rest/v1/direcciones?user_id=eq.' + uid + '&select=*&order=principal.desc,created_at.asc', { headers: h(tok) })
    .then(function(r){ if(!r.ok) throw new Error('sin tabla'); return r.json(); })
    .then(function(rows){
      _dirs = rows || [];
      return profP.then(function(){
        if(!_dirs.length && _profBase && _profBase.direccion){
          var seed = { user_id: uid, nombre: _profBase.nombre || null, telefono: _profBase.telefono || null, direccion: _profBase.direccion, ciudad: _profBase.ciudad || null, departamento: _profBase.departamento || null, pais: _profBase.pais || null, referencia: _profBase.referencia || null, principal: true };
          return fetch(SUPABASE_URL + '/rest/v1/direcciones', { method: 'POST', headers: Object.assign({}, h(tok), { 'Prefer': 'return=representation' }), body: JSON.stringify(seed) })
            .then(function(r){ return r.ok ? r.json() : []; })
            .then(function(nr){ if(nr && nr.length) _dirs = nr; })
            .catch(function(){});
        }
      });
    })
    .then(function(){ renderDirs(); applyDirToProf(); })
    .catch(function(){
      _dirs = null;
      profP.then(function(){
        if(document.getElementById('ship-form')) loadShipLegacy();
        renderCheckoutDir();
      });
    });
}
function dirFld(id, label, val, ph){
  return '<label style="display:block;font-size:13px;color:var(--mut);margin:10px 0 4px">' + label + '</label>'
    + '<input id="' + id + '" type="text" value="' + esc(val || '') + '" placeholder="' + ph + '" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-family:inherit;font-size:15px">';
}
function renderDirs(){
  var box = document.getElementById('ship-form');
  if(!box || !_dirs) return;
  var html = '';
  if(!_dirs.length){
    html += '<p class="empty">Todavía no tienes direcciones guardadas.</p>';
  } else {
    html += _dirs.map(function(a){
      return '<div class="dir-card' + (a.principal ? ' prin' : '') + '">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b style="font-size:15px">' + esc(a.direccion || 'Sin dirección') + '</b>' + (a.principal ? '<span class="dir-badge">Principal</span>' : '') + '</div>'
        + '<p style="font-size:13px;color:var(--mut);margin-top:4px">' + esc([[a.ciudad, a.departamento].filter(Boolean).join(', '), a.pais].filter(Boolean).join(' · ')) + '</p>'
        + (a.referencia ? '<p style="font-size:13px;color:var(--mut)">Referencia: ' + esc(a.referencia) + '</p>' : '')
        + (a.telefono ? '<p style="font-size:13px;color:var(--mut)">Tel: ' + esc(a.telefono) + '</p>' : '')
        + '<div class="dir-ops">'
        + (a.principal ? '' : '<button class="dir-op" data-prin="' + a.id + '">Hacer principal</button>')
        + '<button class="dir-op" data-edit="' + a.id + '">Editar</button>'
        + '<button class="dir-op danger" data-del="' + a.id + '">Eliminar</button>'
        + '</div></div>';
    }).join('');
  }
  html += '<button class="btn" id="dir-add" style="margin-top:6px">＋ Agregar dirección</button><div id="dir-form"></div>';
  box.innerHTML = html;
  box.querySelectorAll('[data-prin]').forEach(function(b){ b.onclick = function(){ setPrincipalDir(b.dataset.prin); }; });
  box.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick = function(){ openDirForm(b.dataset.edit); }; });

function saveDir(id){

    direccion: document.getElementById('df-dir').value.trim() || null,

    departamento: document.getElementById('df-dep').value.trim() || null,

    referencia: document.getElementById('df-ref').value.trim() || null,
    telefono: document.getElementById('df-tel').value.trim() || null
  };
  if(!body.direccion){ alert('Escribe la dirección.'); return; }
  var quierePrin = document.getElementById('df-prin').checked;
  var tok = session.access_token, uid = session.user.id;
  var req = id
    ? fetch(SUPABASE_URL + '/rest/v1/direcciones?id=eq.' + id, { method: 'PATCH', headers: Object.assign({}, h(tok), { 'Prefer': 'return=representation' }), body: JSON.stringify(body) })
    : fetch(SUPABASE_URL + '/rest/v1/direcciones', { method: 'POST', headers: Object.assign({}, h(tok), { 'Prefer': 'return=representation' }), body: JSON.stringify(Object.assign({ user_id: uid, principal: false }, body)) });
  req.then(function(r){ if(!r.ok) throw new Error('db'); return r.json(); })

    fetch(SUPABASE_URL + '/auth/v1/user', { method: 'PUT', headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + getTok(), 'Content-Type': 'application/json' }, body: JSON.stringify({ email: em }) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        btn.disabled = false; btn.textContent = 'Guardar correo';
        if(res.ok){ msg.style.color = '#1c7c43'; msg.textContent = 'Te envié un correo de confirmación a ' + em + '. Ábrelo y toca el enlace para que el cambio se aplique.'; }
        else { msg.style.color = '#b3261e'; msg.textContent = 'No se pudo cambiar el correo. Intenta de nuevo.'; }
      })

  };
}
function wireChangePass(getEmail, setSession){
  Array.prototype.forEach.call(document.querySelectorAll('.eye'), function(b){
    if(b._w) return; b._w = 1;
    b.onclick = function(){
      var i = document.getElementById(b.getAttribute('data-for'));
      if(!i) return;
      var s = i.type === 'password';
      i.type = s ? 'text' : 'password';
      b.textContent = s ? 'Ocultar' : 'Ver';
    };
  });
  var btn = document.getElementById('cp-btn');
  if(!btn) return;
  btn.onclick = function(){
    var msg = document.getElementById('cp-msg');
    function err(m){ msg.style.color = '#b3261e'; msg.textContent = m; }
    var cur = document.getElementById('cp-cur').value;
    var nw = document.getElementById('cp-new').value;
    var nw2 = document.getElementById('cp-new2').value;
    if(!cur){ err('Escribe tu contraseña actual.'); return; }
    if(nw.length < 6){ err('La contraseña nueva debe tener mínimo 6 caracteres.'); return; }
    if(nw !== nw2){ err('Las contraseñas nuevas no coinciden.'); return; }
    btn.disabled = true; btn.textContent = 'Guardando…';
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: getEmail(), password: cur })
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if(!res.ok){ btn.disabled = false; btn.textContent = 'Cambiar contraseña'; err('La contraseña actual no es correcta.'); return null; }
        setSession(res.j);
        return fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + res.j.access_token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: nw })
        }).then(function(r){ return { ok: r.ok }; });
      })
      .then(function(r2){
        if(!r2) return;
        btn.disabled = false; btn.textContent = 'Cambiar contraseña';
        if(r2.ok){
          msg.style.color = '#1c7c43'; msg.textContent = 'Contraseña actualizada.';
          document.getElementById('cp-cur').value = '';
          document.getElementById('cp-new').value = '';
          document.getElementById('cp-new2').value = '';
        } else { err('No se pudo actualizar. Intenta de nuevo.'); }
      })
      .catch(function(){ btn.disabled = false; btn.textContent = 'Cambiar contraseña'; err('Error de conexión. Intenta de nuevo.'); });
  };
}

function starsHTML(r){ var s = ''; for(var i = 1; i <= 5; i++) s += i <= Math.round(r) ? '★' : '☆'; return '<span class="stars">' + s + '</span>'; }
function loadMyReviews(){
  var el = document.getElementById('my-revs');
  if(!el) return;
  Promise.all([
    fetch(SUPABASE_URL + '/rest/v1/seller_reviews?user_id=eq.' + session.user.id + '&select=*,sellers!inner(nombre)&order=created_at.desc', { headers: h(session.access_token) }).then(function(r){ return r.ok ? r.json() : []; }),
    fetch(SUPABASE_URL + '/rest/v1/product_reviews?user_id=eq.' + session.user.id + '&select=*,products!inner(titulo)&order=created_at.desc', { headers: h(session.access_token) }).then(function(r){ return r.ok ? r.json() : []; })
  ]).then(function(res){
    var items = res[0].map(function(r){ return { t: 'Empresa: ' + r.sellers.nombre, rating: r.rating, com: r.comentario, d: r.created_at }; })
      .concat(res[1].map(function(r){ return { t: 'Producto: ' + r.products.titulo, rating: r.rating, com: r.comentario, d: r.created_at }; }));
    items.sort(function(a, b){ return new Date(b.d) - new Date(a.d); });
    if(!items.length){ el.innerHTML = '<p class="empty">Aún no dejas reseñas.</p>'; return; }
    el.innerHTML = items.slice(0, 10).map(function(r){
      return '<div class="item"><div class="info"><b>' + esc(r.t) + '</b><div>' + starsHTML(r.rating) + '</div><small>' + esc(r.com || '') + '</small></div></div>';
    }).join('');
  }).catch(function(){ el.innerHTML = '<p class="empty">No se pudieron cargar.</p>'; });
}
function chQty(id, d){
  var it = cart.find(function(x){ return x.id === id; });
  var q = it.qty + d;
  if(q < 1) return rmItem(id);
  fetch(SUPABASE_URL + '/rest/v1/cart_items?id=eq.' + id, {
    method: 'PATCH', headers: h(session.access_token), body: JSON.stringify({ qty: q })
  }).then(loadCart);
}
function rmItem(id){
  fetch(SUPABASE_URL + '/rest/v1/cart_items?id=eq.' + id, { method: 'DELETE', headers: h(session.access_token) }).then(loadCart);
}
boot();

document.getElementById('menu-btn').onclick = function(e){ e.stopPropagation(); document.getElementById('menu').classList.toggle('open'); };
document.addEventListener('click', function(){ var m = document.getElementById('menu'); if(m) m.classList.remove('open'); });
function routeMiCuenta(tipo, slug){
  if(tipo === 'vendedor' && slug){ location.href = '/Dominus/vendedor/index.html?s=' + encodeURIComponent(slug) + '&edit=1'; }
  else if(tipo === 'vendedor'){ location.href = '/Dominus/vendedor/cuenta.html'; }
  else { location.href = '/Dominus/comprador/perfil.html'; }
}
function goMiCuenta(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(!(s && s.access_token)) return true;

    var uid = (s.user && s.user.id) || null;
    if(!uid) return true;
    var H = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token };
    fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + uid + '&select=tipo,es_admin', { headers: H })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(rows && rows[0] && rows[0].es_admin){ try{ localStorage.removeItem('dominus_tipo'); localStorage.removeItem('dominus_slug'); }catch(e){} location.href = '/Dominus/admin.html'; return; }
      var t = (rows && rows[0] && rows[0].tipo) || 'comprador';
      try{ localStorage.setItem('dominus_tipo', t); }catch(e){}
      if(t === 'vendedor'){
        fetch(SUPABASE_URL + '/rest/v1/sellers?user_id=eq.' + uid + '&select=slug', { headers: H })
        .then(function(r){ return r.json(); })
        .then(function(r2){
          var sl = (r2 && r2[0] && r2[0].slug) || null;
          if(sl){ try{ localStorage.setItem('dominus_slug', sl); }catch(e){} }
          routeMiCuenta(t, sl);
        }).catch(function(){ routeMiCuenta(t, null); });
      } else {
        routeMiCuenta(t, null);
      }
    }).catch(function(){ location.href = '/Dominus/cuenta.html'; });
    return false;
  }catch(e){ return true; }
}
function doLogout(){
  try{
    localStorage.removeItem('dominus_session');
    localStorage.removeItem('dominus_tipo');
    localStorage.removeItem('dominus_slug');
  }catch(e){}
  location.href = '/Dominus/index.html';
  return false;
}
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(s && s.access_token){
      var b = document.getElementById('menu-logout');
      if(b) b.style.display = 'block';
    }
  }catch(e){}
})();
