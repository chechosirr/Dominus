*{box-sizing:border-box;margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
body{background:#17171b;color:#17171b}
#fondo{position:fixed;inset:0;z-index:0;overflow:hidden;background:#17171b}
#fondo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(16px) brightness(.95);transform:scale(1.18);opacity:0;transition:opacity 1.4s ease}
#fondo img.on{opacity:1}

header.top{z-index:6}
.wrap{position:relative;z-index:2}
body.sobre h1.sec{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
body.sobre p.sub{color:rgba(255,255,255,.88);text-shadow:0 1px 4px rgba(0,0,0,.4)}
body.plano{background:#f4f4f6}
body.plano #fondo{display:none}
.secs{display:flex;gap:8px;margin:0 0 14px}

.secs button.on{background:rgba(255,255,255,.88);color:#17171b}

header.top .logo{font-weight:900;letter-spacing:2px;font-size:20px}
header.top .logo span{color:#c8a24a}
header.top button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px 40px}
h1.sec{font-size:22px;margin:4px 2px 2px}
p.sub{color:#6b6b72;font-size:13px;margin:0 2px 12px}

.catbtn .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#fff;font-size:24px;font-weight:300;opacity:.9}
.searchbar{display:flex;gap:8px;margin:0 0 12px}
.searchbar input{flex:1;padding:11px 14px;border:1.5px solid #c9c9cf;border-radius:999px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.card img{width:100%;height:130px;object-fit:contain;background:#fff}
.card .inf{padding:8px 10px 10px}
.card .inf b{font-size:13px;display:block;line-height:1.25;min-height:32px}
.card .inf span{color:#17171b;font-weight:800}
.backrow{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.backrow button{background:#2f2f34;color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.backrow h1{font-size:20px}
.note{color:#8a8a91;font-size:12px;text-align:center;margin-top:18px}

var seccion = 'Hombre', estilo = 'foto', catActual = null;
function money(n){ return '$' + Number(n).toFixed(2); }
var fondoTimer = null, fondoIdx = 0, fondoFotos = [];
function fijarFondo(){
 fondoFotos = DATA[seccion].map(function(c){ return c.foto; }).filter(Boolean).slice(0, 6);
 var f1 = document.getElementById('f1'), f2 = document.getElementById('f2');
 if(fondoTimer){ clearInterval(fondoTimer); fondoTimer = null; }
 f1.classList.remove('on'); f2.classList.remove('on');
 if(!fondoFotos.length) return;
 fondoIdx = 0;
 f1.src = fondoFotos[0]; f1.classList.add('on');
 if(fondoFotos.length > 1){
  fondoTimer = setInterval(function(){
   fondoIdx = (fondoIdx + 1) % fondoFotos.length;
   var entra = f1.classList.contains('on') ? f2 : f1;
   var sale = entra === f1 ? f2 : f1;
   entra.src = fondoFotos[fondoIdx];
   entra.classList.add('on'); sale.classList.remove('on');
  }, 6000);
 }
}
function vistaCats(){
 catActual = null;
 document.body.classList.add('sobre'); document.body.classList.remove('plano');
 fijarFondo();
 var v = document.getElementById('vista');
 var h = '<div class="secs">' + ['Hombre','Mujer','Niños'].map(function(x){ return '<button class="' + (x===seccion?'on':'') + '" onclick="setSeccion(\'' + x + '\')">' + x + '</button>'; }).join('') + '</div>'
 + '<h1 class="sec">' + seccion + '</h1><p class="sub">Zapatos nuevos provenientes de Estados Unidos</p>';
 DATA[seccion].forEach(function(c, i){
  h += '<button class="catbtn" onclick="abrirCat(' + i + ')">'
   + '<span class="nm">' + c.nombre + '</span><span class="chev">›</span></button>';
 });
 h += '<p class="note" style="color:rgba(255,255,255,.75)">Vista previa del diseño · Toca una categoría para ver su interior con el buscador · Los botones de sección de arriba son solo para moverte en esta muestra</p>';
 v.innerHTML = h;
 window.scrollTo(0, 0);
}
function setSeccion(x){ seccion = x; vistaCats(); }
function abrirCat(i){
 var c = DATA[seccion][i]; catActual = c;
 pintarCat('');
}
function pintarCat(q){
 document.body.classList.remove('sobre'); document.body.classList.add('plano');
 if(fondoTimer){ clearInterval(fondoTimer); fondoTimer = null; }
 var c = catActual;
 var prods = c.prods.filter(function(p){ return !q || p.n.toLowerCase().indexOf(q.toLowerCase()) >= 0; });
 var v = document.getElementById('vista');
 var h = '<div class="backrow"><button onclick="vistaCats()" aria-label="Volver">←</button><h1>' + c.nombre + '</h1></div>'
 + '<div class="searchbar"><input id="q" type="search" placeholder="Buscar en ' + c.nombre + '…" value="' + q.replace(/"/g,'&quot;') + '" oninput="pintarCat(this.value);var e=document.getElementById(\'q\');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>'
 + '<div class="grid">';
 prods.slice(0, 24).forEach(function(p){
  h += '<div class="card"><img src="' + p.f + '" alt=""><div class="inf"><b>' + p.n + '</b><span>' + money(p.p) + '</span></div></div>';
 });
 if(!prods.length) h += '<p class="sub">Ningún zapato coincide con esa búsqueda en esta categoría.</p>';
 h += '</div><p class="note">Vista previa · se muestran los primeros ' + Math.min(24, prods.length) + ' de la categoría, ya con la mezcla de bandas</p>';
 v.innerHTML = h;
}
function volver(){ if(catActual) vistaCats(); }
vistaCats();
