<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preview — Escaparate: centrado, fondo blanco, $100+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Source Sans 3',Arial,sans-serif;background:#f2f2f4}
/* ===== Escaparate: MISMO código que llevará zapatos.html (preview 2026-11-24) ===== */
#catview{position:fixed;inset:0;height:100vh;height:100dvh;z-index:58;max-width:none;width:100%;margin:0;padding:0;display:flex;flex-direction:column;justify-content:flex-end;background:#f2f2f4;overflow:hidden;touch-action:none;overscroll-behavior:none}
#catview .esc-fondo{position:absolute;inset:0}
#catview .esc-brand{position:absolute;top:calc(16px + env(safe-area-inset-top));left:20px;z-index:3;font-family:Archivo,'Source Sans 3',Arial,sans-serif;font-weight:900;font-size:1.55rem;letter-spacing:.22em;color:#232327}
#catview .esc-brand em{font-style:normal;background:linear-gradient(120deg,#17171a 0%,#565b63 35%,#232327 55%,#7c828b 80%,#2c2c30 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#catview .esc-fondo .esc-slide{position:absolute;inset:0;opacity:0;transition:opacity 3s ease-in-out;background:linear-gradient(to bottom,#ffffff 0%,#fbfbfc 26%,#eeeef0 48%,#dedee2 72%,#c9c9cf 100%)}
#catview .esc-fondo .esc-slide.on{opacity:1}
/* La foto vive en una zona centrada de la pantalla (debajo de la marca y encima de los botones): nunca tapa las letras */
#catview .esc-fondo .esc-main{position:absolute;left:0;right:0;top:12%;width:100%;height:46%;object-fit:contain;object-position:center;mix-blend-mode:multiply}
#catview .esc-fondo .esc-blur{display:none}
#catview .cat-bottom{position:relative;z-index:2;width:100%;max-width:560px;margin:0 auto;padding:0 18px calc(20px + env(safe-area-inset-bottom))}
#catview .cat-sub{color:#26262b;font-size:1.32rem;font-weight:600;margin:0 0 16px}
#catview .cat-grid{display:flex;flex-direction:column;gap:12px;max-width:none;width:100%}
#catview .cat-card{background:rgba(17,17,21,.55);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:17px 20px;box-shadow:0 10px 28px rgba(0,0,0,.38);width:100%;font-family:inherit;cursor:pointer}
#catview .cat-card::before{display:none}
#catview .cat-name{color:#fff;font-size:1.22rem;font-weight:700}
@media (min-width:900px){
#catview .esc-fondo .esc-blur{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.25);filter:blur(26px) brightness(.94)}
#catview .esc-fondo .esc-main{mix-blend-mode:normal;height:100%;top:0;object-position:center}
#catview .esc-fondo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,10,.30) 0%,rgba(8,8,10,.03) 34%,rgba(8,8,10,.40) 68%,rgba(8,8,10,.80) 100%)}
#catview .esc-brand{color:#f5f5f7}
#catview .esc-brand em{background:linear-gradient(120deg,#ffffff 0%,#c2c9d4 35%,#f4f6f9 55%,#98a2b1 80%,#e8ecf1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#catview .cat-sub{color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.7)}
}
</style>
</head>
<body>
<div id="catview">
  <div class="esc-brand">DOMIN<em>US</em></div>
  <div class="esc-fondo" id="esc-fondo" aria-hidden="true"></div>
  <div class="cat-bottom">
  <p class="cat-sub">¿Para quién buscas?</p>
  <div class="cat-grid">
    <button class="cat-card" data-cat="hombre"><span class="cat-name">Hombre</span></button>
    <button class="cat-card" data-cat="mujer"><span class="cat-name">Mujer</span></button>
    <button class="cat-card" data-cat="ninos"><span class="cat-name">Niños</span></button>
  </div>
  </div>
</div>
<script src="https://chechosirr.github.io/Dominus/outlet-products.js"></script>
<script>
/* ---------- Escaparate: 5 fotos en rotación; selección por hora.
   REGLAS (Sergio, 2026-11-24): solo zapatos de $100 o más y SOLO fotos con fondo blanco
   (se comprueban las esquinas de cada foto; la que no es blanca, no entra). ---------- */
var escHour = -1, escIdx = 0, escBuilding = false;
function escRand(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var escWhiteCache = {};
try{ escWhiteCache = JSON.parse(localStorage.getItem('dom_esc_white_v1') || '{}'); }catch(e){ escWhiteCache = {}; }
function escSaveCache(){ try{ if(Object.keys(escWhiteCache).length > 800) escWhiteCache = {}; localStorage.setItem('dom_esc_white_v1', JSON.stringify(escWhiteCache)); }catch(e){} }
function escIsWhite(url){
  return new Promise(function(resolve){
    if(url in escWhiteCache){ resolve(escWhiteCache[url] === 1); return; }
    var img = new Image(); img.crossOrigin = 'anonymous';
    var done = false;
    var to = setTimeout(function(){ if(!done){ done = true; escWhiteCache[url] = 0; resolve(false); } }, 6000);
    img.onload = function(){
      if(done) return; done = true; clearTimeout(to);
      try{
        var c = document.createElement('canvas'); c.width = 48; c.height = 48;
        var x = c.getContext('2d'); x.drawImage(img, 0, 0, 48, 48);
        var d = x.getImageData(0, 0, 48, 48).data;
        function patch(px, py){
          var r = 0, g = 0, b = 0, n = 0;
          for(var yy = py; yy < py + 5; yy++) for(var xx = px; xx < px + 5; xx++){
            var i = (yy * 48 + xx) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
          }
          return [r / n, g / n, b / n];
        }
        var pts = [patch(0, 0), patch(43, 0), patch(0, 43), patch(43, 43), patch(21, 0), patch(21, 43), patch(0, 21), patch(43, 21)];
        var ok = true;
        for(var k = 0; k < pts.length; k++){ if(pts[k][0] < 240 || pts[k][1] < 240 || pts[k][2] < 240){ ok = false; break; } }
        escWhiteCache[url] = ok ? 1 : 0; escSaveCache();
        resolve(ok);
      }catch(e){ escWhiteCache[url] = 0; resolve(false); }
    };
    img.onerror = function(){ if(!done){ done = true; clearTimeout(to); escWhiteCache[url] = 0; resolve(false); } };
    img.src = url;
  });
}
function escPick(pool, n){
  var out = [], i = 0;
  function next(){
    if(out.length >= n || i >= pool.length || i > 160) return Promise.resolve(out);
    var batch = pool.slice(i, i + 4); i += 4;
    return Promise.all(batch.map(function(p){ return escIsWhite(p.fotos[0]); })).then(function(res){
      for(var k = 0; k < batch.length && out.length < n; k++){ if(res[k]) out.push(batch[k]); }
      return next();
    });
  }
  return next();
}
function escBuild(){
  var cont = document.getElementById('esc-fondo'); if(!cont || typeof ZAPATOS === 'undefined') return;
  var hour = Math.floor(Date.now() / 3600000);
  if(hour === escHour && (cont.children.length || escBuilding)) return;
  escHour = hour; escBuilding = true;
  var rnd = escRand((hour % 2147483646) + 1);
  function shuffled(gen){
    var pool = ZAPATOS.filter(function(p){ return p.genero === gen && p.precio >= 100 && p.fotos && p.fotos.length; });
    for(var i = pool.length - 1; i > 0; i--){ var j = Math.floor(rnd() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    return pool;
  }
  var H = shuffled('Hombre'), M = shuffled('Mujer'), N = shuffled('Niños');
  Promise.all([escPick(H, 2), escPick(M, 2), escPick(N, 1)]).then(function(r){
    var picks = [r[0][0], r[1][0], r[2][0], r[0][1], r[1][1]].filter(Boolean);
    cont.innerHTML = '';
    picks.forEach(function(p, i){
      var slide = document.createElement('div');
      slide.className = 'esc-slide' + (i === 0 ? ' on' : '');
      var b = document.createElement('img');
      b.className = 'esc-blur'; b.src = p.fotos[0]; b.alt = ''; if(i > 1) b.loading = 'lazy';
      var m = document.createElement('img');
      m.className = 'esc-main'; m.src = p.fotos[0]; m.alt = ''; if(i > 1) m.loading = 'lazy';
      slide.appendChild(b); slide.appendChild(m);
      cont.appendChild(slide);
    });
    escIdx = 0; escBuilding = false;
  });
}
escBuild();
setInterval(function(){
  escBuild();
  var cont = document.getElementById('esc-fondo'); if(!cont) return;
  var imgs = cont.children; if(imgs.length < 2) return;
  if(imgs[escIdx]) imgs[escIdx].classList.remove('on');
  escIdx = (escIdx + 1) % imgs.length;
  imgs[escIdx].classList.add('on');
}, 8000);
</script>
</body>
</html>
