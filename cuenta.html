<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear cuenta — Dominus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--card:#101318;--line:#1e242e;--txt:#f2f4f8;--mut:#9aa3b2;--acc:#d7dce3;--err:#ff5d5d}
body{background:linear-gradient(135deg,#100b22 0%,#2b1a4e 38%,#5a5468 68%,#939aab 100%);background-attachment:fixed;color:var(--txt);font-family:Archivo,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;text-decoration:none;color:var(--txt)}
.logo em{font-style:normal;color:var(--acc)}
.back{color:var(--mut);text-decoration:none;font-size:14px}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 18px}
.box{width:100%;max-width:480px}
.box h1{font-size:26px;font-weight:900;margin-bottom:6px;text-align:center}
.box h1 .hl{color:var(--acc)}
.box>p{color:var(--mut);font-size:14px;margin-bottom:22px;text-align:center}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}
.type-card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:26px 16px;text-align:center;cursor:pointer;transition:border-color .15s}
.type-card:hover{border-color:#2c3542}
.type-card.on{border-color:var(--acc);background:rgba(215,220,227,.08)}
.type-card .ico{font-size:40px;display:block;margin-bottom:10px}
.type-card b{font-size:16px;display:block;margin-bottom:6px}
.type-card small{color:var(--mut);font-size:12px;line-height:1.5;display:block}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px;margin-top:18px}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font-family:inherit;font-weight:800;font-size:14px;padding:11px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#0a0c10}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:inherit;font-size:15px;padding:13px 14px;outline:none}
input:focus{border-color:var(--acc)}
.btn{width:100%;margin-top:20px;background:var(--acc);color:#0a0c10;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;padding:14px;cursor:pointer}
.err{display:none;background:rgba(255,93,93,.12);border:1px solid var(--err);color:#ffb3b3;font-size:13px;border-radius:12px;padding:11px 14px;margin-top:16px}
.okmsg{display:none;background:rgba(215,220,227,.12);border:1px solid var(--acc);color:#e8ecf1;font-size:13px;border-radius:12px;padding:11px 14px;margin-top:16px}
.hidden{display:none!important}
.feat{margin-top:16px;font-size:13px;color:var(--mut);line-height:1.8}
.feat b{color:var(--txt)}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;padding:22px}
@media(max-width:480px){.type-grid{grid-template-columns:1fr}}

/* ===== plateado metálico ===== */
.hl,.logo em{background:linear-gradient(120deg,#ffffff 0%,#c2c9d4 35%,#f4f6f9 55%,#98a2b1 80%,#e8ecf1 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.btn:not(.btn-ghost):not(.btn-wa),.buy,.hero-search button{background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%)!important;color:#0a0c10!important;border:0!important}
.card-price,.pd-price{background:linear-gradient(120deg,#ffffff,#c2c9d4 40%,#f4f6f9 60%,#98a2b1)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}

.menu-wrap{position:relative;margin-left:auto}
#menu-btn{background:none;border:1px solid var(--line);color:var(--txt);font-size:20px;border-radius:12px;padding:8px 13px;cursor:pointer;font-family:inherit}
.menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:200px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:50}
.menu.open{display:block}
.menu a{display:block;padding:14px 20px;text-decoration:none;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);color:var(--txt)}
.menu a:last-child{border-bottom:0}
.menu a:hover{background:rgba(215,220,227,.08)}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="index.html">DOMIN<em>US</em></a>
  <div class="menu-wrap">
    <button id="menu-btn" aria-label="Menú">☰</button>
    <nav class="menu" id="menu">
      <a href="index.html">Inicio</a>
      <a href="cuenta.html">Mi cuenta</a>
      <a href="comprador/perfil.html">Carrito</a>
    </nav>
  </div>
</header>
<main>
  <div class="box">
    <h1>Crea tu <span class="hl">cuenta</span></h1>
    <p>Elige qué tipo de cuenta quieres:</p>
    <div class="type-grid">
      <div class="type-card on" id="t-comprador">
        <span class="ico">🛒</span><b>Comprador</b>
        <small>Compra productos, guarda tu carrito y deja reseñas.</small>
      </div>
      <div class="type-card" id="t-vendedor">
        <span class="ico">🏪</span><b>Vendedor</b>
        <small>Abre tu muro, publica productos y recibe reseñas.</small>
      </div>
    </div>
    <div class="form-card">
      <div class="tabs">
        <button id="tab-in" class="on">Entrar</button>
        <button id="tab-up">Crear cuenta</button>
      </div>
      <div id="form-in">
        <label>Correo electrónico</label>
        <input id="in-email" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email">
        <label>Contraseña</label>
        <input id="in-pass" type="password" placeholder="••••••••" autocomplete="current-password">
        <button class="btn" id="btn-in">Entrar</button>
      </div>
      <div id="form-up" class="hidden">
        <label>Tu nombre</label>
        <input id="up-name" type="text" placeholder="Ej: María Pérez" autocomplete="name">
        <label>Correo electrónico</label>
        <input id="up-email" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email">
        <label>Contraseña (mínimo 6 caracteres)</label>
        <input id="up-pass" type="password" placeholder="••••••••" autocomplete="new-password">
        <button class="btn" id="btn-up">Crear mi cuenta</button>
      </div>
      <div class="feat" id="feat"></div>
      <div class="err" id="err"></div>
      <div class="okmsg" id="okmsg"></div>
    </div>
  </div>
</main>
<footer>© 2026 Dominus · Compra y vende seguro</footer>
<script>
var SUPABASE_URL = "https://mmmkwkjzfyijnffniykt.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbWt3a2p6Znlpam5mZm5peWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTIzNDUsImV4cCI6MjEwNzY2ODM0NX0.xa-0G0E1vbGZGUvfvWsAMS9vNdg17pR68ee-kU8aur4";
/* sesión persistente: renueva el token automáticamente */
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(!s || !s.access_token || !s.refresh_token) return;
    var exp = 0;
    if(s.expires_at) exp = s.expires_at * 1000;
    else { try{ exp = JSON.parse(atob(s.access_token.split('.')[1])).exp * 1000; }catch(e){} }
    if(!exp || Date.now() < exp - 120000) return;
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function(r){ return r.json(); }).then(function(ns){
      if(ns && ns.access_token){ localStorage.setItem('dominus_session', JSON.stringify(ns)); location.reload(); }
      else localStorage.removeItem('dominus_session');
    }).catch(function(){});
  }catch(e){}
})();

var tipo = 'comprador';
function headers(token){
  var h = { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' };
  if(token) h['Authorization'] = 'Bearer ' + token;
  return h;
}
function showErr(m){ var e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; }
function hideErr(){ document.getElementById('err').style.display = 'none'; }
function saveSession(s){ localStorage.setItem('dominus_session', JSON.stringify(s)); }
var FEATS = {
  comprador: 'Con tu cuenta de <b>comprador</b> puedes:<br>✓ Guardar tu carrito en todos tus dispositivos<br>✓ Comprar más rápido<br>✓ Dejar reseñas de empresas y productos',
  vendedor: 'Con tu cuenta de <b>vendedor</b> puedes:<br>✓ Crear tu muro personalizado<br>✓ Publicar productos con fotos y especificaciones<br>✓ Recibir reseñas de tus clientes'
};
function setTipo(t){
  tipo = t;
  document.getElementById('t-comprador').classList.toggle('on', t === 'comprador');
  document.getElementById('t-vendedor').classList.toggle('on', t === 'vendedor');
  document.getElementById('feat').innerHTML = FEATS[t];
}
document.getElementById('t-comprador').onclick = function(){ setTipo('comprador'); };
document.getElementById('t-vendedor').onclick = function(){ setTipo('vendedor'); };
var qp = new URLSearchParams(location.search);
if(qp.get('tipo') === 'vendedor') setTipo('vendedor'); else setTipo('comprador');

var tabIn = document.getElementById('tab-in'), tabUp = document.getElementById('tab-up');
tabIn.onclick = function(){ tabIn.classList.add('on'); tabUp.classList.remove('on'); document.getElementById('form-in').classList.remove('hidden'); document.getElementById('form-up').classList.add('hidden'); hideErr(); };
tabUp.onclick = function(){ tabUp.classList.add('on'); tabIn.classList.remove('on'); document.getElementById('form-up').classList.remove('hidden'); document.getElementById('form-in').classList.add('hidden'); hideErr(); };

function api(path, token){
  return fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: headers(token) }).then(function(r){
    if(!r.ok) throw new Error('api'); return r.json();
  });
}
function ensureProfile(s, name){
  // busca perfil; si no existe lo crea con el tipo elegido
  return api('profiles?user_id=eq.' + s.user.id + '&select=tipo', s.access_token).then(function(rows){
    if(rows && rows.length) return rows[0].tipo;
    return fetch(SUPABASE_URL + '/rest/v1/profiles', {
      method: 'POST', headers: headers(s.access_token),
      body: JSON.stringify({ user_id: s.user.id, tipo: tipo, nombre: name || null })
    }).then(function(){ return tipo; }).catch(function(){ return tipo; });
  }).catch(function(){ return tipo; });
}
function goTo(t, s){
  if(t === 'vendedor'){
    api('sellers?user_id=eq.' + s.user.id + '&select=id,slug', s.access_token).then(function(rows){
      location.href = (rows && rows.length) ? 'vendedor/index.html?s=' + rows[0].slug + '&edit=1' : 'vendedor/cuenta.html';
    }).catch(function(){ location.href = 'vendedor/cuenta.html'; });
  } else {
    location.href = 'comprador/perfil.html';
  }
}
document.getElementById('btn-in').onclick = function(){
  hideErr();
  var email = document.getElementById('in-email').value.trim();
  var pass = document.getElementById('in-pass').value;
  if(!email || !pass){ showErr('Escribe tu correo y contraseña.'); return; }
  fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST', headers: headers(), body: JSON.stringify({ email: email, password: pass })
  }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if(!res.ok){ showErr(res.j.msg || 'No se pudo entrar. Revisa tus datos.'); return; }
      saveSession(res.j);
      ensureProfile(res.j).then(function(t){ goTo(t, res.j); });
    }).catch(function(){ showErr('Error de conexión. Intenta de nuevo.'); });
};
document.getElementById('btn-up').onclick = function(){
  hideErr();
  var name = document.getElementById('up-name').value.trim();
  var email = document.getElementById('up-email').value.trim();
  var pass = document.getElementById('up-pass').value;
  if(!name){ showErr('Escribe tu nombre.'); return; }
  if(!email || pass.length < 6){ showErr('Escribe un correo válido y una contraseña de mínimo 6 caracteres.'); return; }
  fetch(SUPABASE_URL + '/auth/v1/signup', {
    method: 'POST', headers: headers(), body: JSON.stringify({ email: email, password: pass, data: { nombre: name } })
  }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if(!res.ok){ showErr(res.j.msg || 'No se pudo crear la cuenta.'); return; }
      var done = function(s){ saveSession(s); ensureProfile(s, name).then(function(){ goTo(tipo, s); }); };
      if(res.j.session) done(res.j.session);
      else {
        var e = document.getElementById('okmsg'); e.textContent = 'Cuenta creada. Ahora entra con tu correo y contraseña.'; e.style.display = 'block';
        tabIn.onclick();
      }
    }).catch(function(){ showErr('Error de conexión. Intenta de nuevo.'); });
};

document.getElementById('menu-btn').onclick = function(e){ e.stopPropagation(); document.getElementById('menu').classList.toggle('open'); };
document.addEventListener('click', function(){ var m = document.getElementById('menu'); if(m) m.classList.remove('open'); });
</script>
</body>
</html>
