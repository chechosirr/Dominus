<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto — Dominus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--card:#101318;--line:#1e242e;--txt:#111111;--mut:#5a6270;--acc:#4a4a52;--err:#ff5d5d;--star:#f5b301}
body{background:#ffffff;background-attachment:fixed;color:#111111;font-family:'Source Sans 3',Archivo,Arial,sans-serif;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#2a2a2e;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;text-decoration:none;flex:0 0 auto}
.logo em{font-style:normal;color:var(--acc)}
.back{color:var(--mut);text-decoration:none;font-size:14px}
main{max-width:900px;margin:0 auto;padding:22px 18px 70px}
.pd{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:720px){.pd{grid-template-columns:1fr 1fr}}
.pd-img{border-radius:20px;overflow:hidden;background:#161b24;aspect-ratio:1}
.pd-img img{width:100%;height:100%;object-fit:cover;display:block}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px;background:#161b24;aspect-ratio:1}
.gal::-webkit-scrollbar{display:none}
.gal-slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.gal-slide img{width:100%;height:100%;object-fit:cover;display:block}
.gal-dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.gdot{width:8px;height:8px;border-radius:50%;background:#3a4350;transition:background .2s}
.gdot.on{background:var(--acc)}
.pd-info h1{font-size:26px;font-weight:900;margin-bottom:6px}
.pd-seller{font-size:14px;color:var(--mut);margin-bottom:12px}
.pd-seller a{color:var(--acc);text-decoration:none;font-weight:700}
.pd-price{font-size:34px;font-weight:900;color:var(--acc);margin:10px 0 16px}
.btn{display:block;width:100%;background:var(--acc);color:#0a0c10;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;padding:14px;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--txt)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:20px}
.sec h2{font-size:19px;margin-bottom:12px}
.sec h2 .hl{color:var(--acc)}
.sec p.desc{font-size:15px;line-height:1.7;color:#d4d9e2;white-space:pre-wrap}
.specs{font-size:14px;line-height:1.8;color:#d4d9e2;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.stars{color:var(--star);font-size:18px;letter-spacing:2px}
.rev{border-top:1px solid var(--line);padding:14px 0}
.rev:first-of-type{border-top:0}
.rev .rn{font-weight:700;font-size:14px}
.rev .rt{color:var(--mut);font-size:12px;margin-left:8px}
.rev p{font-size:14px;color:#d4d9e2;margin-top:6px;line-height:1.6}
.avg{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.avg b{font-size:32px}
.rform label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
.rform textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:inherit;font-size:14px;padding:12px;min-height:90px;resize:vertical;outline:none}
.rform textarea:focus{border-color:var(--acc)}
.starin{display:flex;gap:6px;font-size:30px}
.starin button{background:none;border:0;color:#3a4354;font-size:30px;cursor:pointer;font-family:inherit;padding:0}
.starin button.on{color:var(--star)}
.rerr{display:none;background:rgba(255,93,93,.12);border:1px solid var(--err);color:#ffb3b3;font-size:13px;border-radius:12px;padding:11px 14px;margin-top:14px}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:20px}
.login-cta{text-align:center;font-size:14px;color:var(--mut);padding:16px}
.login-cta a{color:var(--acc);font-weight:700;text-decoration:none}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px;padding:22px}

/* ===== plateado metálico ===== */
.hl,.logo em{background:linear-gradient(120deg,#ffffff 0%,#c2c9d4 35%,#f4f6f9 55%,#98a2b1 80%,#e8ecf1 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.btn:not(.btn-ghost):not(.btn-wa),.buy,.hero-search button{background:linear-gradient(135deg,#ffffff 0%,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4 100%)!important;color:#0a0c10!important;border:0!important}
.card-price,.pd-price{background:linear-gradient(120deg,#ffffff,#c2c9d4 40%,#f4f6f9 60%,#98a2b1)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}

.menu-wrap{position:relative;margin-left:auto}
#menu-btn{background:none;border:1px solid var(--line);color:#f2f4f8;font-size:20px;border-radius:12px;padding:8px 13px;cursor:pointer;font-family:inherit}
.menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:200px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:50}
.menu.open{display:block}
.menu a{display:block;padding:14px 20px;text-decoration:none;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);color:#f2f4f8}
.menu a:last-child{border-bottom:0}
.menu a:hover{background:rgba(215,220,227,.08)}
body{display:flex;flex-direction:column;min-height:100vh}footer{margin-top:auto}</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../index.html">DOMIN<em>US</em></a>
  <div class="menu-wrap">
    <button id="menu-btn" aria-label="Menú">☰</button>
    <nav class="menu" id="menu">
      <a href="../index.html">Inicio</a>
      <a href="../cuenta.html" onclick="return goMiCuenta()">Mi cuenta</a>
      <a href="../comprador/perfil.html">Carrito</a>
          <a href="#" id="menu-logout" style="display:none;color:#ff7b7b" onclick="return doLogout()">Cerrar sesión</a>
</nav>
  </div>
</header>
<main id="main"><p class="empty">Cargando…</p></main>
<footer>© 2026 Dominus · Compra y vende seguro</footer>
<script>
var SUPABASE_URL = "https://mmmkwkjzfyijnffniykt.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tbWt3a2p6Znlpam5mZm5peWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTIzNDUsImV4cCI6MjEwNzY2ODM0NX0.xa-0G0E1vbGZGUvfvWsAMS9vNdg17pR68ee-kU8aur4";
/* sesión persistente: renueva el token automáticamente */
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(!s || !s.access_token || !s.refresh_token) return;
    var exp = 0;
    if(s.expires_at) exp = s.expires_at * 1000;
    else { try{ exp = JSON.parse(atob(s.access_token.split('.')[1])).exp * 1000; }catch(e){} }
    if(!exp || Date.now() < exp - 120000) return;
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function(r){ return r.json(); }).then(function(ns){
      if(ns && ns.access_token){ localStorage.setItem('dominus_session', JSON.stringify(ns)); location.reload(); }
      else localStorage.removeItem('dominus_session');
    }).catch(function(){});
  }catch(e){}
})();

function api(path, token){
  var hh = { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' };
  if(token) hh['Authorization'] = 'Bearer ' + token;
  return fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: hh }).then(function(r){
    if(!r.ok) throw new Error('api ' + r.status); return r.json();
  });
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n){ return '$' + Number(n).toFixed(2); }
function buyerSession(){ try { var s = JSON.parse(localStorage.getItem('dominus_session')); return (s && s.access_token) ? s : null; } catch(e){ return null; } }
function starsHTML(r){ var s = ''; for(var i = 1; i <= 5; i++) s += i <= Math.round(r) ? '★' : '☆'; return '<span class="stars">' + s + '</span>'; }

var PID = new URLSearchParams(location.search).get('id');
var PRODUCT = null, REVIEWS = [], myRating = 5;

function load(){
  if(!PID){ document.getElementById('main').innerHTML = '<p class="empty">Producto no encontrado.</p>'; return; }
  Promise.all([
    api('products?id=eq.' + PID + '&select=*,sellers!inner(id,slug,nombre,verificado)'),
    api('product_reviews?product_id=eq.' + PID + '&select=*&order=created_at.desc')
  ]).then(function(res){
    if(!res[0].length || !res[0][0].activo){ document.getElementById('main').innerHTML = '<p class="empty">Este producto ya no está disponible.</p>'; return; }
    PRODUCT = res[0][0]; REVIEWS = res[1] || [];
    document.title = PRODUCT.titulo + ' — Dominus';
    render();
  }).catch(function(){ document.getElementById('main').innerHTML = '<p class="empty">No se pudo cargar. Revisa tu conexión.</p>'; });
}
function render(){
  var p = PRODUCT, s = p.sellers || {};
  var avg = REVIEWS.length ? REVIEWS.reduce(function(a, r){ return a + r.rating; }, 0) / REVIEWS.length : 0;
  var sess = buyerSession();
  var imgs = [p.imagen_url, p.imagen2_url, p.imagen3_url].filter(Boolean);
  var galHtml = '<div class="gal" id="pgal">' + imgs.map(function(u){
    return '<div class="gal-slide"><img src="' + esc(u) + '" alt="' + esc(p.titulo) + '"></div>';
  }).join('') + '</div>';
  if(imgs.length > 1) galHtml += '<div class="gal-dots" id="pdots">' + imgs.map(function(_, i){
    return '<span class="gdot' + (i === 0 ? ' on' : '') + '"></span>';
  }).join('') + '</div>';
  var html = '<div class="pd">' + (imgs.length ? galHtml : '<div class="pd-img"></div>')
    + '<div class="pd-info"><h1>' + esc(p.titulo) + '</h1>'
    + '<div class="pd-seller">Vendido por <a href="../vendedor/?s=' + esc(s.slug || '') + '">' + esc(s.nombre || '') + '</a>' + (s.verificado ? ' ✓' : '') + '</div>'
    + (REVIEWS.length ? '<div>' + starsHTML(avg) + ' <small style="color:var(--mut)">' + avg.toFixed(1) + ' · ' + REVIEWS.length + ' reseña(s)</small></div>' : '<small style="color:var(--mut)">Sin reseñas aún</small>')
    + '<div class="pd-price">' + money(p.precio) + '</div>'
    + '<a class="btn" href="' + esc(p.paypal_link || '#') + '" target="_blank" rel="noopener">Comprar</a>'
    + '<button class="btn btn-ghost" id="btn-cart">+ Agregar al carrito</button></div></div>';
  if(p.descripcion) html += '<div class="sec"><h2>Descripción</h2><p class="desc">' + esc(p.descripcion) + '</p></div>';
  if(p.especificaciones) html += '<div class="sec"><h2>Especificaciones</h2><div class="specs">' + esc(p.especificaciones) + '</div></div>';
  html += '<div class="sec"><h2>Reseñas <span class="hl">(' + REVIEWS.length + ')</span></h2>';
  if(REVIEWS.length){
    html += '<div class="avg"><b>' + avg.toFixed(1) + '</b>' + starsHTML(avg) + '</div>';
    html += REVIEWS.map(function(r){
      return '<div class="rev"><span class="rn">' + esc(r.nombre || 'Comprador') + '</span><span class="rt">' + new Date(r.created_at).toLocaleDateString('es') + '</span><div>' + starsHTML(r.rating) + '</div><p>' + esc(r.comentario || '') + '</p></div>';
    }).join('');
  } else html += '<p class="empty">Sé el primero en dejar una reseña.</p>';
  if(sess){
    html += '<div class="rform"><h2 style="margin-top:8px">Deja tu <span class="hl">reseña</span></h2>'
      + '<label>Calificación</label><div class="starin" id="starin">' + [1,2,3,4,5].map(function(i){ return '<button data-v="' + i + '" class="' + (i <= 5 ? 'on' : '') + '">★</button>'; }).join('') + '</div>'
      + '<label>Comentario</label><textarea id="r-com" placeholder="¿Qué te pareció este producto?"></textarea>'
      + '<button class="btn" id="r-send">Publicar reseña</button><div class="rerr" id="rerr"></div></div>';
  } else {
    html += '<p class="login-cta"><a href="../cuenta.html?tipo=comprador">Entra a tu cuenta</a> para dejar una reseña.</p>';
  }
  html += '</div>';
  document.getElementById('main').innerHTML = html;

  document.getElementById('btn-cart').onclick = function(){
    var b = this;
    if(!sess){ location.href = '../cuenta.html?tipo=comprador'; return; }
    b.disabled = true; b.textContent = 'Agregando…';
    fetch(SUPABASE_URL + '/rest/v1/cart_items', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + sess.access_token, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify({ user_id: sess.user.id, product_id: PRODUCT.id, qty: 1 })
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if(res.ok && res.j.length && res.j[0].qty > 1){
          fetch(SUPABASE_URL + '/rest/v1/cart_items?id=eq.' + res.j[0].id, {
            method: 'PATCH', headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + sess.access_token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ qty: res.j[0].qty + 1 })
          });
        }
        b.textContent = '✓ En el carrito';
      }).catch(function(){ b.disabled = false; b.textContent = '+ Agregar al carrito'; });
  };
  var si = document.getElementById('starin');
  if(si){
    si.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){ myRating = Number(b.dataset.v); si.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', Number(x.dataset.v) <= myRating); }); };
    });
    document.getElementById('r-send').onclick = sendReview;
  }
}
document.addEventListener('scroll', function(ev){
  var g = document.getElementById('pgal');
  if(!g || ev.target !== g) return;
  var i = Math.round(g.scrollLeft / g.clientWidth);
  document.querySelectorAll('#pdots .gdot').forEach(function(d, j){ d.classList.toggle('on', j === i); });
}, true);
function sendReview(){
  var sess = buyerSession();
  if(!sess) return;
  var com = document.getElementById('r-com').value.trim();
  var name = (sess.user.user_metadata && sess.user.user_metadata.nombre) || (sess.user.email || '').split('@')[0] || 'Comprador';
  fetch(SUPABASE_URL + '/rest/v1/product_reviews', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + sess.access_token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ product_id: PRODUCT.id, user_id: sess.user.id, nombre: name, rating: myRating, comentario: com || null })
  }).then(function(r){ if(!r.ok) throw 0; load(); })
    .catch(function(){ var e = document.getElementById('rerr'); e.textContent = 'No se pudo publicar. Intenta de nuevo.'; e.style.display = 'block'; });
}
load();

document.getElementById('menu-btn').onclick = function(e){ e.stopPropagation(); document.getElementById('menu').classList.toggle('open'); };
document.addEventListener('click', function(){ var m = document.getElementById('menu'); if(m) m.classList.remove('open'); });
function routeMiCuenta(tipo, slug){
  if(tipo === 'vendedor' && slug){ location.href = '/Dominus/vendedor/index.html?s=' + encodeURIComponent(slug) + '&edit=1'; }
  else if(tipo === 'vendedor'){ location.href = '/Dominus/vendedor/cuenta.html'; }
  else { location.href = '/Dominus/comprador/perfil.html'; }
}
function goMiCuenta(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(!(s && s.access_token)) return true;
    var tipo = localStorage.getItem('dominus_tipo');
    var slug = localStorage.getItem('dominus_slug');
    if(tipo){ routeMiCuenta(tipo, slug); return false; }
    var uid = (s.user && s.user.id) || null;
    if(!uid) return true;
    var H = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + s.access_token };
    fetch(SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + uid + '&select=tipo', { headers: H })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var t = (rows && rows[0] && rows[0].tipo) || 'comprador';
      try{ localStorage.setItem('dominus_tipo', t); }catch(e){}
      if(t === 'vendedor'){
        fetch(SUPABASE_URL + '/rest/v1/sellers?user_id=eq.' + uid + '&select=slug', { headers: H })
        .then(function(r){ return r.json(); })
        .then(function(r2){
          var sl = (r2 && r2[0] && r2[0].slug) || null;
          if(sl){ try{ localStorage.setItem('dominus_slug', sl); }catch(e){} }
          routeMiCuenta(t, sl);
        }).catch(function(){ routeMiCuenta(t, null); });
      } else {
        routeMiCuenta(t, null);
      }
    }).catch(function(){ location.href = '/Dominus/cuenta.html'; });
    return false;
  }catch(e){ return true; }
}
function doLogout(){
  try{
    localStorage.removeItem('dominus_session');
    localStorage.removeItem('dominus_tipo');
    localStorage.removeItem('dominus_slug');
  }catch(e){}
  location.href = '/Dominus/index.html';
  return false;
}
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('dominus_session') || 'null');
    if(s && s.access_token){
      var b = document.getElementById('menu-logout');
      if(b) b.style.display = 'block';
    }
  }catch(e){}
})();
</script>
</body>
</html>
